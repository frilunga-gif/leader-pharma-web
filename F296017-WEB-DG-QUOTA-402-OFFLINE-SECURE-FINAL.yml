name: Leader Pharma F29.6.0.17 WEB DG QUOTA 402 OFFLINE SECURE FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corriger:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajouter secours DG quota 402
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app.js")
          s = p.read_text(encoding="utf-8")
          marker = "LEADER PHARMA F29.6.0.17 DG QUOTA 402 OFFLINE SECURE ACTIF"

          patch = r'''

/* LP_F296017_DG_QUOTA_402_OFFLINE_SECURE_START */
(function(){
  'use strict';

  const MARK =
    'LEADER PHARMA F29.6.0.17 DG QUOTA 402 OFFLINE SECURE ACTIF';

  if(window.__LP_F296017_DG_QUOTA_402_OFFLINE_SECURE__){
    return;
  }

  window.__LP_F296017_DG_QUOTA_402_OFFLINE_SECURE__ = true;

  const baseFetch = window.fetch.bind(window);

  window.fetch = async function(input, init){
    const response = await baseFetch(input, init);

    try{
      const url =
        typeof input === 'string'
          ? input
          : String(input && input.url ? input.url : '');

      if(
        response &&
        response.status === 402 &&
        url.includes('/auth/v1/token') &&
        url.includes('grant_type=password')
      ){
        throw new TypeError(
          'Supabase quota 402 - bascule DG hors ligne securisee'
        );
      }
    }catch(error){
      if(error instanceof TypeError){
        throw error;
      }
    }

    return response;
  };

  console.log(MARK);
})();
/* LP_F296017_DG_QUOTA_402_OFFLINE_SECURE_END */
'''

          if marker not in s:
              s += patch
              p.write_text(s, encoding="utf-8")
              print("PATCH AJOUTE")
          else:
              print("PATCH DEJA PRESENT")

          out = p.read_text(encoding="utf-8")
          assert marker in out
          assert "SUPABASE EGRESS MAITRISE ACTIF" in out
          assert "RESET DONNEES DG SEUL ACTIF" in out
          PY

      - name: Verifier JavaScript
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq "LEADER PHARMA F29.6.0.17 DG QUOTA 402 OFFLINE SECURE ACTIF" app.js
          grep -Fq "LEADER PHARMA F29.6.0.17 SUPABASE EGRESS MAITRISE ACTIF" app.js
          grep -Fq "LEADER PHARMA F29.6.0.17 RESET DONNEES DG SEUL ACTIF" app.js

      - name: Commit et push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: DG secure offline fallback on Supabase 402 quota"
          git push
