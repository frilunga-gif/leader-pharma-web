name: Leader Pharma WEB V74 PHOTOS RH HARMONISEES

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recuperer la base RH verifiee
        shell: python
        run: |
          from pathlib import Path
          import urllib.request
          import json
          import hashlib
          import shutil

          base = 'https://frilunga-gif.github.io/leader-pharma-web/'
          request = urllib.request.Request(
              base + 'platform-manifest.json',
              headers={'Cache-Control': 'no-cache'}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              manifest = json.loads(response.read())

          assert manifest['schema'] == 1
          assert manifest['build'] == 2026101402, (
              'Publier V73 FIX1 avant ce correctif. '
              'Ne pas remplacer une version plus recente.'
          )

          expected = {
              'index.html', 'app.js', 'dg-security.js',
              'platform-update.js', 'styles.css',
              'assets/leader-pharma-logo.png'
          }
          assert set(manifest['files']) == expected

          site = Path('site')
          site.mkdir(exist_ok=True)

          for source in Path('.').iterdir():
              if source.name in ('.git', '.github', 'site'):
                  continue
              destination = site / source.name
              if source.is_dir():
                  shutil.copytree(
                      source, destination, dirs_exist_ok=True
                  )
              elif source.is_file():
                  shutil.copy2(source, destination)

          for name, fingerprint in manifest['files'].items():
              url = (
                  base + 'platform/' +
                  str(manifest['build']) + '/' + name
              )
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              assert hashlib.sha256(data).hexdigest() == fingerprint, name
              destination = site / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

      - name: Harmoniser uniquement photos et envois RH
        shell: python
        run: |
          from pathlib import Path

          p = Path('site/app.js')
          s = p.read_text(encoding='utf-8')

          start = s.index(
              "const MARK='LEADER PHARMA F29.6.0.17 "
              "POINTAGE PRIVE ECONOMIQUE FIX6 ACTIF'"
          )
          end = s.index(
              '/* LEADER PHARMA F29.6.0.17 TICKET', start
          )
          b = s[start:end]

          def replace_once(old, new):
              global b
              assert b.count(old) == 1, (
                  'Base inattendue : ' + old
              )
              b = b.replace(old, new)

          replace_once(
              'if(!auth.username||!auth.password) return false;',
              'if(!auth.username) return false;'
          )
          replace_once(
              '(replay||!row.lpAttendanceServerConfirmedAt)',
              '(replay||row.lpAttendanceSentSignatureV74!==signature(row))'
          )
          replace_once(
              "const result=await request({action:'upsert',row:payload(row)});",
              "const submitted=signature(row);\n"
              "          const result=await request("
              "{action:'upsert',row:payload(row)});"
          )
          replace_once(
              'row.lpAttendanceServerConfirmedAt=new Date().toISOString();persist();',
              'row.lpAttendanceServerConfirmedAt=new Date().toISOString();'
              'row.lpAttendanceSentSignatureV74=submitted;persist();'
          )
          replace_once(
              'flushHistory:()=>flushHistory(true),service:ENDPOINT',
              'flushHistory:()=>flushHistory(true),'
              'flushHistoryAuto:()=>flushHistory(false),service:ENDPOINT'
          )

          s = s[:start] + b + s[end:]

          start = s.index(
              '/* ============================================================\n'
              '   LEADER PHARMA POINTAGE STANDARD JOUR / NUIT V7'
          )
          end = s.index(
              '/* ============================================================\n'
              '   LEADER PHARMA MASTER PRO V10', start
          )
          b = s[start:end]

          replace_once(
              'if(!auth.username||!auth.password)return false;',
              'if(!auth.username)return false;'
          )
          replace_once(
              'async function sendCanonical(){',
              "let sendFlight=null,sentPayload='';\n"
              "  async function sendCanonical(){\n"
              "    if(sendFlight)return sendFlight;\n"
              "    sendFlight=sendCanonicalOnce();\n"
              "    try{return await sendFlight;}"
              "finally{sendFlight=null;}\n"
              "  }\n"
              "  async function sendCanonicalOnce(){"
          )
          replace_once(
              '    try{\n      const response=await fetch(ENDPOINT',
              '    const sig=JSON.stringify(payload);\n'
              '    if(sig===sentPayload)return true;\n'
              '    try{\n      const response=await fetch(ENDPOINT'
          )
          replace_once(
              'row.lpAttendanceServerConfirmedAt=new Date().toISOString();'
              'persist();return true;',
              'sentPayload=sig;'
              'row.lpAttendanceServerConfirmedAt=new Date().toISOString();'
              'persist();return true;'
          )
          replace_once(
              '    [150,1200,4000,12000,30000].forEach('
              'delay=>setTimeout(sendCanonical,delay));',
              '    sendTimer=setTimeout(async()=>{'
              'const ok=await sendCanonical();'
              'if(!ok&&navigator.onLine)scheduleRetry();},150);\n'
              '  }\n'
              '  function scheduleRetry(){\n'
              '    clearTimeout(sendTimer);'
              'sendTimer=setTimeout(async()=>{'
              'const ok=await sendCanonical();'
              'if(!ok&&navigator.onLine)scheduleRetry();},10000);'
          )

          s = s[:start] + b + s[end:]

          s += r"""
          /* LEADER PHARMA V74 PHOTO SOURCE DEDIEE */
          (function(){
            'use strict';
            const photos=new Map();
            const norm=v=>String(v||'').trim().toLowerCase();
            const key=r=>
              norm(r.agency||r.agence)+'|'+
              String(r.date||r.work_date||'')+'|'+
              norm(r.lpUser||r.username||r.user||r.name);

            function remember(r){
              if(!r)return;
              const k=key(r),old=photos.get(k)||{};
              for(const field of ['entryPhoto','exitPhoto']){
                const value=r[field]||
                  r[field==='entryPhoto'?'entry_photo':'exit_photo'];
                if(value)old[field]=value;
              }
              if(old.entryPhoto||old.exitPhoto)photos.set(k,old);
            }

            function retain(){
              if(typeof db==='undefined'||!db)return;
              for(const r of db.attendance||[]){
                const cached=photos.get(key(r));
                if(cached){
                  for(const field of ['entryPhoto','exitPhoto']){
                    if(!r[field]&&cached[field])r[field]=cached[field];
                  }
                }
              }
              // Une suppression DG reste prioritaire.
              if(window.lpPhotoRemovalV72){
                window.lpPhotoRemovalV72.clean();
              }
            }

            for(const r of (db&&db.attendance)||[])remember(r);

            const fetchBase=window.fetch;
            window.fetch=async function(input,init){
              const url=typeof input==='string'
                ?input:input&&input.url||'';
              const response=await fetchBase.apply(this,arguments);
              if(response.ok&&
                 url.includes('/leader-pharma-attendance-jwt-v2')){
                try{
                  const data=await response.clone().json();
                  if(data.ok&&Array.isArray(data.rows)){
                    data.rows.forEach(remember);
                    retain();
                  }
                }catch(error){}
              }
              return response;
            };

            const saveBase=save;
            save=function(){
              for(const r of db.attendance||[])remember(r);
              retain();
              const out=saveBase.apply(this,arguments);
              queue();
              return out;
            };
            window.save=save;

            const renderBase=render;
            render=function(){
              retain();
              return renderBase.apply(this,arguments);
            };
            window.render=render;

            const rowsBase=window.lpV25RefreshRhRowsOnly;
            if(typeof rowsBase==='function'){
              window.lpV25RefreshRhRowsOnly=function(){
                retain();
                return rowsBase.apply(this,arguments);
              };
            }

            let timer,flight=null;

            function queue(){
              if(!currentUser||
                 norm(currentUser.role)==='dg'||
                 navigator.onLine===false)return;
              clearTimeout(timer);
              timer=setTimeout(flush,250);
            }

            async function flush(){
              if(flight)return flight;
              const attendance=window.LeaderPharmaAttendanceV1;
              if(!attendance)return false;
              flight=(async()=>{
                if(window.lpPointageStandardV7){
                  await window.lpPointageStandardV7.sync();
                }else{
                  await attendance.pushAuto();
                }
                if(attendance.flushHistoryAuto){
                  await attendance.flushHistoryAuto();
                }
              })();
              try{return await flight;}
              finally{flight=null;}
            }

            const ready=window.lpF2946PhotoReady;
            window.lpF2946PhotoReady=function(){
              const out=typeof ready==='function'
                ?ready.apply(this,arguments):undefined;
              queue();
              return out;
            };

            window.addEventListener('online',queue);
            window.lpPhotoContinuityV74={retain,remember,flush};
          })();
          """

          s = s.replace(
              "'F29.6.0.73 MASTER PRO'",
              "'F29.6.0.74 MASTER PRO'"
          ).replace(
              "'29.6.0.73'", "'29.6.0.74'"
          )
          p.write_text(s, encoding='utf-8')

          updater = Path('site/platform-update.js')
          updater.write_text(
              updater.read_text(encoding='utf-8').replace(
                  '73 / RH stable',
                  '74 / photos RH harmonisees'
              ),
              encoding='utf-8'
          )

          worker = r"""
          const CACHE_NAME='leader-pharma-web-v74';
          const FILES=[
            './index.html','./app.js','./dg-security.js',
            './platform-update.js','./styles.css',
            './assets/leader-pharma-logo.png'
          ];

          self.addEventListener('install',event=>{
            event.waitUntil(
              caches.open(CACHE_NAME).then(cache=>cache.addAll(FILES))
            );
          });

          self.addEventListener('message',event=>{
            if(event.data?.type==='ACTIVATE')self.skipWaiting();
          });

          self.addEventListener('activate',event=>{
            event.waitUntil(
              caches.keys().then(keys=>Promise.all(
                keys.filter(key=>
                  key.startsWith('leader-pharma-web-')&&
                  key!==CACHE_NAME
                ).map(key=>caches.delete(key))
              )).then(()=>self.clients.claim())
            );
          });

          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET')return;
            const url=new URL(event.request.url);
            if(url.origin!==self.location.origin)return;
            const base=new URL('./',self.location.href);
            const relative=url.pathname.slice(base.pathname.length);

            if(event.request.mode==='navigate'){
              event.respondWith(
                caches.open(CACHE_NAME)
                  .then(cache=>cache.match('./index.html'))
                  .then(response=>response||fetch(event.request))
              );
              return;
            }

            if(FILES.includes('./'+relative)){
              event.respondWith(
                caches.open(CACHE_NAME)
                  .then(cache=>cache.match('./'+relative))
                  .then(response=>response||fetch(event.request))
              );
            }
          });
          """

          Path('site/service-worker.js').write_text(
              worker.strip()+'\n', encoding='utf-8'
          )

      - name: Verifier JavaScript
        run: |
          node --check site/app.js
          node --check site/dg-security.js
          node --check site/platform-update.js
          node --check site/service-worker.js

      - name: Creer la mise a jour Web et Windows
        shell: python
        run: |
          from pathlib import Path
          import json
          import hashlib
          import shutil

          site = Path('site')
          names = [
              'index.html','app.js','dg-security.js',
              'platform-update.js','styles.css',
              'assets/leader-pharma-logo.png'
          ]

          manifest = {
              'schema': 1,
              'build': 2026101403,
              'version': '29.6.0.74',
              'base': 'Android 72 - photos RH harmonisees',
              'files': {
                  name: hashlib.sha256(
                      (site / name).read_bytes()
                  ).hexdigest()
                  for name in names
              }
          }

          for name in names:
              destination = (
                  site / 'platform' /
                  str(manifest['build']) / name
              )
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(site / name, destination)

          content = json.dumps(manifest)
          (site / 'platform-manifest.json').write_text(
              content, encoding='utf-8'
          )
          (
              site / 'platform' /
              str(manifest['build']) / 'platform-manifest.json'
          ).write_text(content, encoding='utf-8')

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier
        id: deploy
        uses: actions/deploy-pages@v4
