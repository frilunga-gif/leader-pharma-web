name: Leader Pharma F29.6.0.17 WEB DG360 AGENCE STRICTE EGRESS FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corriger:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer depot Web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier base Web
        run: |
          set -euo pipefail

          test -s app.js
          test -s index.html
          test -s styles.css
          test -s dg-security.js
          test -s F296017-WEB-SUPABASE-EGRESS-MAITRISE.yml

          node --check app.js
          node --check dg-security.js

          grep -Fq "LEADER PHARMA F29.6.0.17 RESET DONNEES DG SEUL ACTIF" app.js
          grep -Fq "CENTRE DE CONTROLE DG 360 FINAL" index.html
          grep -Fq "Rapport du jour par utilisateur" index.html
          grep -Fq "Actualisation..." index.html

          sha256sum styles.css | awk '{print $1}' > /tmp/styles.sha
          sha256sum dg-security.js | awk '{print $1}' > /tmp/security.sha

          echo "BASE WEB = OK"

      - name: Corriger UNIQUEMENT DG360 par agence selectionnee
        run: |
          set -euo pipefail

          cat > /tmp/patch-dg360-agence.js <<'NODE'
          const fs = require('fs');

          const path = 'index.html';
          let idx = fs.readFileSync(path, 'utf8');

          const marker = 'LEADER PHARMA F29.6.0.17 DG360 AGENCE STRICTE ACTIF';

          if (!idx.includes(marker)) {
            const reps = [
              [
                "    const ags=agencies();",
                "    /* " + marker + " */\n" +
                "    let selectedAgency='';\n" +
                "    try{ selectedAgency=String(typeof currentAgency!=='undefined'?currentAgency:'').trim(); }catch(e){}\n\n" +
                "    const allAgs=agencies();\n" +
                "    const ags=selectedAgency\n" +
                "      ? allAgs.filter(a=>String(a.id)===selectedAgency)\n" +
                "      : allAgs;\n\n" +
                "    const inAgency=x=>!selectedAgency||String(x?.agency??x?.agence??'')===selectedAgency;"
              ],
              [
                "    const validSales=arr('sales').filter(x=>x&&x.date===d&&norm(x.status)!=='annulee'&&!norm(x.status).includes('annul'));",
                "    const validSales=arr('sales').filter(x=>x&&x.date===d&&inAgency(x)&&norm(x.status)!=='annulee'&&!norm(x.status).includes('annul'));"
              ],
              [
                "    const expensesToday=arr('expenses').filter(x=>x&&x.date===d);",
                "    const expensesToday=arr('expenses').filter(x=>x&&x.date===d&&inAgency(x));"
              ],
              [
                "    const products=arr('products');",
                "    const products=arr('products').filter(x=>x&&(!selectedAgency||!x.agency||String(x.agency)===selectedAgency));"
              ],
              [
                "    const openRec=arr('receivables').filter(x=>x&&!isClosedStatus(x.status));",
                "    const openRec=arr('receivables').filter(x=>x&&inAgency(x)&&!isClosedStatus(x.status));"
              ],
              [
                "    const openDebt=arr('debts').filter(x=>x&&!isClosedStatus(x.status));",
                "    const openDebt=arr('debts').filter(x=>x&&inAgency(x)&&!isClosedStatus(x.status));"
              ],
              [
                "    const attendance=arr('attendance');",
                "    const attendance=arr('attendance').filter(x=>x&&inAgency(x));"
              ],
              [
                "  window.lpF296017DG360Marker=MARK;",
                "  window.lpF296017DG360Marker=MARK;\n  window.lpF296017DG360AgencyStrict='" + marker + "';"
              ]
            ];

            for (const [oldText,newText] of reps) {
              if (!idx.includes(oldText)) {
                throw new Error('DG360 patch point missing: ' + oldText.slice(0,100));
              }
              idx = idx.replace(oldText,newText);
            }

            idx = idx.replace(/toutes les agences/g,'agence sélectionnée');
            idx = idx.replace(/toutes agences/g,'agence sélectionnée');

            fs.writeFileSync(path, idx, 'utf8');
          }

          const check = fs.readFileSync(path,'utf8');

          if (!check.includes(marker)) throw new Error('DG360 strict marker missing');
          if (!/validSales=arr\('sales'\).*inAgency/.test(check)) throw new Error('sales filter missing');
          if (!/expensesToday=arr\('expenses'\).*inAgency/.test(check)) throw new Error('expenses filter missing');
          if (!/attendance=arr\('attendance'\).*inAgency/.test(check)) throw new Error('attendance filter missing');

          console.log('WEB DG360 AGENCE STRICTE = ACTIF');
          NODE

          node /tmp/patch-dg360-agence.js

      - name: Activer Egress Web si absent
        run: |
          set -euo pipefail

          if grep -Fq "LEADER PHARMA F29.6.0.17 SUPABASE EGRESS MAITRISE ACTIF" app.js; then
            echo "Egress Web deja actif."
          else
            python3 - <<'PY'
          from pathlib import Path

          src = Path("F296017-WEB-SUPABASE-EGRESS-MAITRISE.yml").read_text(encoding="utf-8")

          start_marker = "cat >> app.js <<'LP_EGRESS_PATCH'\n"
          end_marker = "\nLP_EGRESS_PATCH"

          if start_marker not in src:
              raise SystemExit("Debut patch Egress introuvable")

          patch = src.split(start_marker, 1)[1]

          if end_marker not in patch:
              raise SystemExit("Fin patch Egress introuvable")

          patch = patch.split(end_marker, 1)[0]

          with Path("app.js").open("a", encoding="utf-8") as f:
              f.write("\n" + patch + "\n")
          PY
          fi

          node --check app.js

          grep -Fq "LEADER PHARMA F29.6.0.17 SUPABASE EGRESS MAITRISE ACTIF" app.js
          grep -Fq "LEADER PHARMA F29.6.0.17 RESET DONNEES DG SEUL ACTIF" app.js

          echo "WEB EGRESS = ACTIF"

      - name: Controle final Web
        run: |
          set -euo pipefail

          node --check app.js
          node --check dg-security.js

          grep -Fq "LEADER PHARMA F29.6.0.17 DG360 AGENCE STRICTE ACTIF" index.html
          grep -Fq "CENTRE DE CONTROLE DG 360 FINAL" index.html
          grep -Fq "Rapport du jour par utilisateur" index.html
          grep -Fq "Actualisation..." index.html

          grep -Fq "LEADER PHARMA F29.6.0.17 SUPABASE EGRESS MAITRISE ACTIF" app.js
          grep -Fq "LEADER PHARMA F29.6.0.17 RESET DONNEES DG SEUL ACTIF" app.js

          test "$(sha256sum styles.css | awk '{print $1}')" = "$(cat /tmp/styles.sha)"
          test "$(sha256sum dg-security.js | awk '{print $1}')" = "$(cat /tmp/security.sha)"

          echo "WEB DG360 AGENCE STRICTE = OK"
          echo "WEB EGRESS = OK"
          echo "STYLES / SECURITE = INCHANGES"

      - name: Publier Web final
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Aucun changement a publier."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html app.js
          git commit -m "F29.6.0.17 Web DG360 agence stricte + Egress"
          git push origin HEAD:main

          echo "WEB FINAL = PUBLIE"
