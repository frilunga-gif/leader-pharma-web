          def one(old,new,label):
              global s
              c=s.count(old)
              if c!=1:
                  raise SystemExit('ERREUR FIX50 '+label+': '+str(c))
              s=s.replace(old,new)
          
          one(
          '''function supplierName(id){return (db.suppliers||[]).find(s=>String(s.id)===String(id))?.name||'—';}''',
          '''function supplierName(id,manual){return (db.suppliers||[]).find(s=>String(s.id)===String(id))?.name||String(manual||'').trim()||'—';}''',
          'supplierName')
          
          one(
          '''function invoiceDuplicate(supplierId,invoice){
              const inv=norm(invoice); if(!supplierId||!inv)return false;
              const inBatch=agencyBatches().some(b=>String(b.supplierId)===String(supplierId)&&norm(b.supplierInvoice)===inv&&!['refusee dg','a corriger'].includes(norm(b.status)));
              const inOld=(db.purchases||[]).some(p=>String(p.agency||'')===String(currentAgency||'')&&String(p.supplierId||'')===String(supplierId)&&norm(p.supplierInvoice)===inv);
              return inBatch||inOld;
