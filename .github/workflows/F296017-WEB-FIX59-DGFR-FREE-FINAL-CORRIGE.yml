          new="(b.lines||[]).forEach(line=>{if(line&&line.manualProduct===true)return;if(!(db.products||[]).some(p=>String(p.id)===String(line.productId))&&!(db.products||[]).some(p=>sameProduct(p,line)))throw new Error('Produit introuvable : '+line.productName);});"
          
          count=s.count(old)
          if count!=1:
              raise SystemExit('ERREUR FIX57 garde produit: '+str(count))
          
          s=s.replace(old,new,1)
          
          s=s.rstrip()+"\n\n/* LEADER PHARMA F29.6.0.17 NOUVEAU PRODUIT STOCK FIX57 ACTIF */\n"
          p.write_text(s,encoding='utf-8')
          
          out=p.read_text(encoding='utf-8')
          for required in [
              marker,
              "if(line&&line.manualProduct===true)return;",
              "if(!base&&line.manualProduct)",
              "price:Number(line.salePrice||0)",
              "LEADER PHARMA F29.6.0.17 PRIX DETAIL DG NOUVEAU PRODUIT FIX56 ACTIF",
