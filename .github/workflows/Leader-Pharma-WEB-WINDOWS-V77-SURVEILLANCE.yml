name: Leader Pharma WEB WINDOWS V77 SURVEILLANCE mise a jour moteur
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/Leader-Pharma-WEB-WINDOWS-V77-SURVEILLANCE.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: leader-pharma-web-publication
  cancel-in-progress: false
jobs:
  corriger_web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verifier le depot Web
      run: test "$GITHUB_REPOSITORY" = "frilunga-gif/leader-pharma-web"
    - name: Separer les notes Surveillance sur le moteur existant
      shell: python
      run: "from pathlib import Path\nimport json,hashlib,re,shutil,os,sys\nm=json.loads(Path('platform-manifest.json').read_text())\ns=Path('app.js').read_text()\nif m.get('version')=='29.6.0.77' and m.get('surveillance_fix')=='V77 NOTES AGENCE':\n    assert 'LP_V77_NOTES_AGENCY_START' in s\n    with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('changed=false\\n')\n    print('Correctif deja installe');sys.exit(0)\nassert m.get('version')=='29.6.0.75','Base Web V75 attendue ; aucun ecrasement d une version differente'\nassert m['files']['app.js']=='62a0f531846bcfaf4ae38c4706410ca4794045a33d3a5f00c85cec9d784e99a0','Autre moteur ; verification requise'\nfor name,digest in m['files'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name\ndef patch77(source, addon):\n    assert 'LP_V77_NOTES_AGENCY_START' not in source\n    assert 'LP_V77_NOTES_AGENCY_START' not in source\n    def once(old,new):\n        nonlocal source\n        assert source.count(old)==1, (old[:80],source.count(old))\n        source=source.replace(old,new)\n    # Run the resolver before the existing notes rendering callbacks fire.\n    source+='\\n'+addon\n    once('''    return all\n      .filter(function(x){\n        if(!x) return false;\n\n        const note = s(x.note);''','''    return window.lpV77Notes.notes(all)\n      .filter(function(x){\n        if(!x) return false;\n\n        const note = s(x.note);''')\n    once('''      const a = agency();\n      const d = todayValue();\n\n      let row = db.dailyUserNotes.find''','''      let attribution;\n      try{ attribution = window.lpV77Notes.capture(user); }\n      catch(e){ try{toast(e.message);}catch(ignore){} return; }\n      const a = attribution.agency;\n      const d = todayValue();\n\n      let row = db.dailyUserNotes.find''')\n    once('''          (!a || !x.agency || norm(x.agency) === norm(a)) &&\n          xWho &&''','''          window.lpV77Notes.resolve(x)?.agency === a &&\n          xWho &&''')\n    once('''      try{\n        if(typeof audit === 'function'){\n          audit('Note fin de journée',username);''','''      Object.assign(row,attribution);\n      try{\n        if(typeof audit === 'function'){\n          audit('Note fin de journée',username);''')\n    once('''            ' note(s)' +\n          '</div>' +''','''            ' note(s) • séparation V77' +\n          '</div>' +\n          '<p class=\"muted\">Anciennes notes : agence du compte auteur. En cas de mutation entre agences, faire vérifier l’historique par le DG. Les notes sans auteur unique restent conservées et sont exclues de cette vue.</p>' +''')\n    once(\"\"\"        if(\n          a &&\n          x.agency &&\n          norm(x.agency) !== a\n        ){\"\"\", \"\"\"        if(window.lpV77Notes.agency(x.agency) !== window.lpV77Notes.agency(activeAgency())){\"\"\")\n    once(\"\"\"                            x.agency ||\n                            activeAgency()\"\"\", \"\"\"                            x.agency\"\"\")\n    return source\n\naddon=\"/* LP_V77_NOTES_AGENCY_START */\\n(function(){\\n'use strict';\\nconst s=v=>String(v==null?'':v).trim();\\nconst n=v=>s(v).normalize('NFD').replace(/[\\\\u0300-\\\\u036f]/g,'').toLowerCase().replace(/\\\\s+/g,' ');\\nconst list=k=>Array.isArray(db[k])?db[k]:[];\\nfunction agency(v){\\n const key=n(v);if(!key)return '';\\n const matches=list('agencies').filter(a=>[a.id,a.name,a.label].some(x=>n(x)===key));\\n return matches.length===1?s(matches[0].id):'';\\n}\\nfunction author(row){\\n const users=list('users');\\n const ids=[row.authorUserId,row.userId].map(n).filter(Boolean);\\n let matches=ids.length?users.filter(u=>ids.includes(n(u.id))):[];\\n if(!ids.length){\\n  const handles=[row.username,row.user,row.login].map(n).filter(Boolean);\\n  matches=users.filter(u=>[u.id,u.username,u.login].map(n).filter(Boolean).some(x=>handles.includes(x)));\\n  if(!matches.length){\\n   const names=[row.name,row.userName,row.user].map(n).filter(Boolean);\\n   matches=users.filter(u=>names.includes(n(u.name)));\\n  }\\n }\\n // Duplicate records for the same identity and same agency are harmless.\\n const byIdentity=new Map();\\n for(const u of matches){const a=agency(u.agency||u.agence||u.agencyId);const id=n(u.id||u.username);if(!a||!id)return null;byIdentity.set(id+'|'+a,u);}\\n return byIdentity.size===1?[...byIdentity.values()][0]:null;\\n}\\nfunction resolve(row){\\n if(!row)return null;\\n // New reports carry the agency captured when submitted; later staff transfers cannot move them.\\n if(row.agencySchema===77){const a=agency(row.reportAgency);return a?{...row,agency:a}:null;}\\n const u=author(row);\\n if(!u)return null;\\n const a=agency(u.agency||u.agence||u.agencyId);\\n return a?{...row,agency:a,lpAgencyFromAccount:true}:null;\\n}\\nfunction notes(input){\\n const unique=new Map();\\n for(const raw of input||[]){\\n  const r=resolve(raw);if(!r)continue;\\n  const u=author(r),who=n(r.authorUserId||u&&u.id||r.username||r.user||r.name);\\n  const key=JSON.stringify([r.agency,s(r.date).slice(0,10),who,s(r.note).replace(/\\\\r\\\\n/g,'\\\\n')]);\\n  const prior=unique.get(key),time=x=>Number(x.updatedAt)||Date.parse(x.updatedAt)||Number(x.createdAt)||0;\\n  if(!prior||time(r)>time(prior))unique.set(key,r);\\n }\\n return [...unique.values()];\\n}\\nfunction capture(user){\\n const resolved=author({authorUserId:user&&user.id,username:user&&user.username,user:user&&user.name});\\n const a=resolved&&agency(resolved.agency||resolved.agence||resolved.agencyId);\\n if(!a)throw Error('Agence du compte non déterminée. Contactez le DG.');\\n return {agency:a,reportAgency:a,agencySchema:77,authorUserId:s(resolved.id),username:s(resolved.username),name:s(resolved.name)};\\n}\\nwindow.lpV77Notes={agency,author,resolve,notes,capture};\\n})();\\n\"\ns=patch77(s,addon)\ns=s.replace('29.6.0.75','29.6.0.77')\nPath('app.js').write_text(s)\nassert int(m['build'])<2026300980\nm.update(version='29.6.0.77',build=2026300980,surveillance_fix='V77 NOTES AGENCE')\nbuild=str(m['build'])\np=Path('index.html');p.write_text(p.read_text().replace('29.6.0.75','29.6.0.77'))\np=Path('service-worker.js');s,n=re.subn(r\"const CACHE_NAME='leader-pharma-web-[^']+';\",\"const CACHE_NAME='leader-pharma-web-\"+build+\"';\",p.read_text(),count=1);assert n==1;p.write_text(s)\np=Path('platform-update.js');s,n=re.subn(r\"window.LP_PLATFORM_BUILD='[^']+';\",\"window.LP_PLATFORM_BUILD='77 / Surveillance par agence';\",p.read_text(),count=1);assert n==1;p.write_text(s)\nfor name in m['files']:m['files'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()\nPath('platform-manifest.json').write_text(json.dumps(m,indent=2))\narchive=Path('platform')/build\nassert not archive.exists(),'Ce build existe deja ; ne pas le remplacer'\narchive.mkdir(parents=True)\nfor name in [*m['files'],'platform-manifest.json','service-worker.js']:\n    dest=archive/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(name,dest)\nPath('.nojekyll').touch()\nPath('/tmp/test-surveillance77.cjs').write_text('const fs=require(\\'fs\\'),vm=require(\\'vm\\'),assert=require(\\'assert/strict\\');\\nconst source=fs.readFileSync(process.argv[2],\\'utf8\\');\\nconst ctx={window:{},db:{agencies:[{id:\\'centre\\',name:\\'Leader Pharma Centre\\'},{id:\\'kamina\\',name:\\'Leader Pharma Kamina\\'}],users:[{id:\\'jp\\',username:\\'jean.paul\\',name:\\'JEAN PAUL\\',agency:\\'centre\\'},{id:\\'ch\\',username:\\'christelle\\',name:\\'CHRISTELLE\\',agency:\\'kamina\\'}]},currentUser:{role:\\'dg\\'},currentAgency:\\'kamina\\',reports(){},render(){},document:{getElementById(){return null;}},console};\\nvm.createContext(ctx);vm.runInContext(source.slice(source.indexOf(\\'/* LP_V77_NOTES_AGENCY_START */\\')),ctx);\\nconst api=ctx.window.lpV77Notes;\\nctx.db.dailyUserNotes=[\\n {id:\\'1\\',username:\\'jean.paul\\',name:\\'JEAN PAUL\\',agency:\\'kamina\\',date:\\'2026-10-23\\',note:\\'52100 FC\\',updatedAt:1},\\n {id:\\'2\\',user:\\'JEAN PAUL\\',agency:\\'kamina\\',date:\\'2026-10-23\\',note:\\'52100 FC\\',updatedAt:2},\\n {id:\\'3\\',username:\\'christelle\\',agency:\\'kamina\\',date:\\'2026-10-23\\',note:\\'Kamina\\'},\\n {id:\\'4\\',user:\\'inconnu\\',agency:\\'kamina\\',date:\\'2026-10-23\\',note:\\'À vérifier\\'},\\n {id:\\'5\\',username:\\'jean.paul\\',agency:\\'centre\\',date:\\'2026-10-23\\',note:\\'Une autre observation\\'}\\n];\\nconst before=JSON.stringify(ctx.db);\\nconst a=source.indexOf(\\'  function notesForDG(){\\'),b=source.indexOf(\\'  function renderNotesDG(){\\',a);\\nvm.runInContext(\"const s=v=>String(v==null?\\'\\':v).trim();const norm=v=>s(v).toLowerCase();const activeAgency=()=>currentAgency;const noteTime=x=>x.updatedAt||0;\"+source.slice(a,b),ctx);\\nlet result=vm.runInContext(\\'notesForDG()\\',ctx);assert.equal(result.length,1);assert.equal(result[0].username,\\'christelle\\');\\nctx.currentAgency=\\'centre\\';result=vm.runInContext(\\'notesForDG()\\',ctx);assert.equal(result.length,2);assert(result.every(r=>r.agency===\\'centre\\'));assert.equal(result.find(r=>r.note===\\'52100 FC\\').id,\\'2\\');\\nassert.equal(JSON.stringify(ctx.db),before,\\'Les données brutes sont conservées\\');\\nconst captured=api.capture(ctx.db.users[0]);assert.equal(captured.reportAgency,\\'centre\\');assert.equal(captured.authorUserId,\\'jp\\');\\nctx.db.users[0].agency=\\'kamina\\';assert.equal(api.resolve({...captured,date:\\'2026-10-23\\',note:\\'historique\\'}).agency,\\'centre\\',\\'Une mutation ne déplace pas un nouveau rapport\\');\\nctx.db.users.push({id:\\'jp2\\',username:\\'jean.paul\\',name:\\'JEAN PAUL\\',agency:\\'centre\\'});\\nassert.equal(api.resolve({username:\\'jean.paul\\',agency:\\'kamina\\'}),null,\\'Auteur ambigu exclu\\');\\nassert.equal(api.resolve({user:\\'inconnu\\',agency:\\'kamina\\'}),null);\\nassert.throws(()=>api.capture({id:\\'inconnu\\'}));\\nassert(source.includes(\\'Object.assign(row,attribution)\\'));\\nassert(source.includes(\\'séparation V77\\'));\\nconsole.log(\\'OK V77: Jean Paul Centre uniquement, Kamina séparé, copies identiques regroupées, observations distinctes conservées, agences nouvelles figées, ambiguïtés exclues, aucune mutation des données\\');\\n')\nPath('/tmp/test-sensitive.cjs').write_text(\"const fs=require('fs'),vm=require('vm'),assert=require('assert');\\nconst s=fs.readFileSync('app.js','utf8');\\nconst a=s.indexOf('function lp169ApplySensitive(){'),b=s.indexOf('function lp169RoleTitle(){',a);\\nlet role='dg';const shown=[],hidden=[];\\nconst items=[{id:'backup',textContent:'Sauvegarder'},{id:'restore',textContent:'Restaurer'},{id:'users',textContent:'Gestion utilisateurs'},{id:'sales',textContent:'Vendre'},{id:'lp16MyPasswordSave',textContent:'Sauvegarder'}];\\nconst ctx={lp169Role:()=>role,lp169Norm:v=>v.toLowerCase(),lp169Show:el=>shown.push(el.id),lp169Hide:el=>hidden.push(el.id),document:{querySelectorAll:()=>items}};\\nvm.createContext(ctx);vm.runInContext(s.slice(a,b),ctx);\\nfor(let i=0;i<100;i++)ctx.lp169ApplySensitive();\\nassert.equal(shown.length,300);assert.equal(hidden.length,0);\\nshown.length=0;role='vendeur';ctx.lp169ApplySensitive();\\nassert.deepEqual(hidden,['backup','restore','users']);assert.equal(shown.length,0);\\nrole='';hidden.length=0;ctx.lp169ApplySensitive();assert.equal(hidden.length,0);\\nconsole.log('PASS: repeated sensitive-control scans, DG access, non-DG restrictions and password exemption');\\n\")\nwith open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('changed=true\\n')\n"
      id: prepare
    - name: Verifier Surveillance et conservation des droits existants
      run: 'set -euo pipefail

        node --check app.js

        node --check dg-security.js

        node --check platform-update.js

        node --check service-worker.js

        node /tmp/test-surveillance77.cjs app.js

        node /tmp/test-sensitive.cjs

        '
      if: steps.prepare.outputs.changed == 'true'
    - name: Enregistrer les fichiers Web corriges
      run: "set -euo pipefail\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add .nojekyll index.html app.js platform-update.js service-worker.js platform-manifest.json platform\nif ! git diff --cached --quiet; then\n git commit -m 'Web et Windows V77: Surveillance par agence uniquement'\n git push origin main\nfi"
      if: steps.prepare.outputs.changed == 'true'
    - name: Demander la publication Pages existante
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        # La source main/root est deja configuree. Ne pas modifier les reglages Pages.

        gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /tmp/lp-pages-build.json'
      if: steps.prepare.outputs.changed == 'true'
    - name: Verifier le correctif reellement publie
      shell: python
      run: "from pathlib import Path\nimport urllib.request,json,hashlib,time,os\nexpected=json.loads(Path('platform-manifest.json').read_text())\nbase='https://frilunga-gif.github.io/leader-pharma-web/'\nfor attempt in range(36):\n try:\n  suffix='?reconnexion='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)\n  request=urllib.request.Request(base+'platform-manifest.json'+suffix,headers={'Cache-Control':'no-cache'})\n  live=json.loads(urllib.request.urlopen(request,timeout=12).read())\n  if live.get('build')==expected['build'] and live.get('web_fix')==expected['web_fix']:\n   app=urllib.request.urlopen(base+'app.js'+suffix,timeout=30).read()\n   assert hashlib.sha256(app).hexdigest()==expected['files']['app.js']\n   print('WEB ET WINDOWS V77 SURVEILLANCE PUBLIE ET VERIFIE')\n   break\n except Exception as error:\n  print('En attente de Pages : '+type(error).__name__)\n time.sleep(5)\nelse:\n raise SystemExit('Publication non confirmee. Les fichiers sont enregistres ; consulter le deploiement Pages.')"
      if: steps.prepare.outputs.changed == 'true'
