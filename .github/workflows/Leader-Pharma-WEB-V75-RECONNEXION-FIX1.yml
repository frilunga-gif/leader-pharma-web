name: Leader Pharma WEB V75 RECONNEXION FIX1
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: leader-pharma-web-publication
  cancel-in-progress: false
jobs:
  corriger_web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verifier le depot Web
      run: test "$GITHUB_REPOSITORY" = "frilunga-gif/leader-pharma-web"
    - name: Corriger uniquement la reconnexion du Web V75
      shell: python
      run: "from pathlib import Path\nimport json,hashlib,re,shutil,sys\np=Path('app.js');raw=p.read_bytes()\nm=json.loads(Path('platform-manifest.json').read_text())\n\
        assert m['version']=='29.6.0.75', 'Correctif reserve a V75 : arret sans modification'\nassert hashlib.sha256(raw).hexdigest()==m['files']['app.js'],\
        \ 'App et manifeste incoherents'\nif 'LEADER PHARMA WEB V75 RECONNEXION FIX1' not in raw.decode():\n assert\
        \ hashlib.sha256(raw).hexdigest()=='398ca1f6978b082443851e07ad61d0afeac33c9bb753454d9f5f905ecefefa88', 'Moteur\
        \ V75 inattendu'\nfrom pathlib import Path\nimport sys\n\nMARKER = 'LEADER PHARMA WEB V75 RECONNEXION FIX1'\n\
        \ndef patch(code):\n    if MARKER in code:\n        return code\n    assert \"29.6.0.75\" in code, 'Ce correctif\
        \ exige le moteur V75'\n    def replace(old, new):\n        nonlocal code\n        assert code.count(old)\
        \ == 1, 'Base inattendue : ' + old[:65]\n        code = code.replace(old, new, 1)\n\n    # Keep server refusals\
        \ and the verified offline password cache unchanged.\n    replace(\"path==='leader-pharma-login-v37'?10000:60000\"\
        , \"path==='leader-pharma-login-v37'?30000:60000\")\n    replace(\"authTimer=setTimeout(()=>authController.abort(),10000)\"\
        , \"authTimer=setTimeout(()=>authController.abort(),30000)\")\n    replace(\"window.lpOfflineV41=false;enter(data.profile,password,data);return\
        \ true;\", \"window.lpOfflineV41=false;enter(data.profile,password,data);\\n  if(typeof window.lp1794UpdateNetwork==='function')window.lp1794UpdateNetwork();\\\
        n  return true;\")\n    replace(\"enter(saved.profile,password,null);window.lpOfflineV41=true;\", \"enter(saved.profile,password,null);window.lpOfflineV41=true;\\\
        n // One recovery attempt after local login, using the existing authenticated queue.\\n if(navigator.onLine!==false)setTimeout(function(){\\\
        n  if(currentUser&&n(currentUser.username)===username&&window.lpOfflineV41&&typeof window.lpV41RetryPending==='function')window.lpV41RetryPending();\\\
        n },1500);\")\n\n    # The old interval could publish a completed request into a logged-out session.\n \
        \   replace(\"   await window.lpGetSessionTokenV16();window.lpOfflineV41=false;\", \"   const userAtStart=currentUser;\\\
        n   await window.lpGetSessionTokenV16();\\n   if(!currentUser||currentUser!==userAtStart)return;\\n   window.lpOfflineV41=false;\"\
        )\n    replace(\"  function localCredentials(){\", \"  let sessionEpoch=0;\\n  window.lpWebResetAuthFlightV75=function(){sessionEpoch++;tokenPromise=null;tokenPromiseUser='';};\\\
        n  function localCredentials(){\")\n    replace(\"  async function acquireToken(){\", \"  async function\
        \ acquireToken(){\\n    const epochAtStart=sessionEpoch;\")\n    replace(\"    window.lpOfflineV41=false;\\\
        n    window.lpAccessToken=auth.access_token;\", \"    if(epochAtStart!==sessionEpoch)throw new Error('SESSION_SUPABASE_UTILISATEUR_CHANGE');\\\
        n    window.lpOfflineV41=false;\\n    window.lpAccessToken=auth.access_token;\")\n    replace(\"    if(!tokenPromise)tokenPromise=acquireToken().catch(e=>{tokenPromise=null;throw\
        \ e});\", \"    if(!tokenPromise){\\n      const flight=acquireToken().catch(e=>{if(tokenPromise===flight)tokenPromise=null;throw\
        \ e});\\n      tokenPromise=flight;\\n    }\")\n    replace(\" const wanted=n(profile.username);if(!Array.isArray(db.users))db.users=[];\"\
        , \" if(typeof window.lpWebResetAuthFlightV75==='function')window.lpWebResetAuthFlightV75();\\n const wanted=n(profile.username);if(!Array.isArray(db.users))db.users=[];\"\
        )\n    replace(\"  function lpF2941LogoutSafe(){\", \"  function lpF2941LogoutSafe(){\\n    if(typeof window.lpWebResetAuthFlightV75==='function')window.lpWebResetAuthFlightV75();\\\
        n    window.lpAccessToken='';window.lpDGAccessToken='';window.lpRefreshToken='';window.lpDGRefreshToken='';\\\
        n    try{sessionStorage.removeItem('lp_f296017_jwt_session_v1');}catch(e){}\")\n    # Tell Internet loss\
        \ apart from a local session awaiting server authentication.\n    replace(\"    else{\\n\\n      box.textContent\
        \ =\\n        '○ Hors ligne';\", \"    else if(navigator.onLine&&window.lpOfflineV41){\\n      box.textContent='◌\
        \ Session locale · reconnexion';\\n      box.style.background='#fff4dc';box.style.color='#805800';\\n  \
        \    box.title='Internet détecté ; authentification serveur non confirmée. Données locales conservées.';\\\
        n    }\\n    else{\\n\\n      box.textContent =\\n        '○ Hors ligne';\")\n    return code + '\\n/* '\
        \ + MARKER + ' */\\n'\n\nif True:\n    p=Path(sys.argv[1] if len(sys.argv)>1 else 'app.js')\n    p.write_text(patch(p.read_text(encoding='utf-8')),encoding='utf-8')\n\
        \nm['web_fix']='V75 RECONNEXION FIX1'\nif p.read_bytes()!=raw:\n m['build']=max(int(m['build'])+1,2026300976)\n\
        build=str(m['build'])\ns=Path('service-worker.js');worker=s.read_text()\nworker,n=re.subn(r\"const CACHE_NAME='leader-pharma-web-[^']+';\"\
        , \"const CACHE_NAME='leader-pharma-web-\"+build+\"';\",worker,count=1)\nassert n==1, 'Cache inattendu'\n\
        s.write_text(worker)\nu=Path('platform-update.js');updater=u.read_text()\nupdater,n=re.subn(r\"window.LP_PLATFORM_BUILD='[^']+';\"\
        , \"window.LP_PLATFORM_BUILD='75 / reconnexion Web FIX1';\",updater,count=1)\nassert n==1, 'Moteur de mise\
        \ a jour inattendu'\nu.write_text(updater)\nfor name in m['files']:\n m['files'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()\n\
        Path('platform-manifest.json').write_text(json.dumps(m,indent=2))\narchive=Path('platform')/build\narchive.mkdir(parents=True,exist_ok=True)\n\
        for name in [*m['files'],'platform-manifest.json','service-worker.js']:\n target=archive/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(name,target)\n\
        Path('.nojekyll').touch()\nprint('Correctif Web prepare ; version 75 conservee ; build '+build)\n"
    - name: Tester les sessions et la reprise sans reinitialisation
      run: "set -euo pipefail\nnode --check app.js\nnode --check platform-update.js\nnode --check service-worker.js\n\
        cat > /tmp/lp-web-reconnect-test.cjs <<'JS'\nconst fs=require('fs'),vm=require('vm'),assert=require('assert');\n\
        const code=fs.readFileSync(process.argv[2]||'web-reconnect/test-patched.js','utf8');\nasync function main(){\n\
        \ const pending=[];\n const ctx={SUPABASE:{url:'https://example.invalid',key:'public'},currentUser:{username:'alice',password:'test'},navigator:{onLine:true},Headers,Request,AbortController,atob,setTimeout:()=>1,clearTimeout(){},console,decodeURIComponent};\n\
        \ ctx.window=ctx;ctx.fetch=()=>new Promise(resolve=>pending.push(resolve));\n const a=code.indexOf('/* LEADER\
        \ PHARMA SESSION SUPABASE COMMUNE V16 */'),b=code.indexOf('/* LEADER PHARMA V18 PARAMETRES NON DG PROPRES\
        \ */',a);\n vm.createContext(ctx);vm.runInContext(code.slice(a,b),ctx);\n const old=ctx.lpGetSessionTokenV16();const\
        \ oldRejected=assert.rejects(old,/UTILISATEUR_CHANGE/);\n assert.equal(pending.length,1);\n ctx.lpWebResetAuthFlightV75();ctx.currentUser={username:'bob',password:'test'};\n\
        \ const fresh=ctx.lpGetSessionTokenV16();assert.equal(pending.length,2);\n pending[0]({ok:true,json:async()=>({ok:true,profile:{username:'alice'},access_token:'alice-token'})});\n\
        \ await oldRejected;\n const shared=ctx.lpGetSessionTokenV16();assert.equal(pending.length,2,'Old request\
        \ must not clear the new flight');\n pending[1]({ok:true,json:async()=>({ok:true,profile:{username:'bob'},access_token:'bob-token'})});\n\
        \ assert.equal(await fresh,'bob-token');assert.equal(await shared,'bob-token');assert.equal(ctx.lpAccessToken,'bob-token');\n\
        \ console.log('PASS: logout/change-user rejects old auth response and preserves new in-flight request');\n\
        \n const box={style:{}},badge={window:null,navigator:{onLine:true},lp1794CreateIndicator:()=>box};badge.window=badge;\n\
        \ vm.createContext(badge);const f=code.indexOf('function lp1794UpdateNetwork(){');\n vm.runInContext(code.slice(f,code.indexOf(\"\
        window.addEventListener(\\n  'online'\",f)),badge);\n badge.lpOfflineV41=true;badge.lp1794UpdateNetwork();assert.match(box.textContent,/Session\
        \ locale/);\n badge.navigator.onLine=false;badge.lp1794UpdateNetwork();assert.match(box.textContent,/Hors\
        \ ligne/);\n badge.navigator.onLine=true;badge.lpOfflineV41=false;badge.lp1794UpdateNetwork();assert.match(box.textContent,/En\
        \ ligne/);\n console.log('PASS: offline network, local session and authenticated session have distinct indicators');\n\
        \n let release,flush=0;const user={username:'alice'};\n const retry={currentUser:user,navigator:{onLine:true},document:{hidden:false,addEventListener(){}},setInterval(){},window:null};retry.window=retry;retry.addEventListener=()=>{};\n\
        \ retry.lpGetSessionTokenV16=()=>new Promise(r=>release=r);retry.lpF296017FlushSalesCentral=async()=>{flush++};retry.lpOfflineV41=true;\n\
        \ vm.createContext(retry);const ra=code.indexOf('/* LEADER PHARMA V41 REPRISE DES VENTES ET PHOTOS SANS\
        \ RENDU */');\n vm.runInContext(code.slice(ra,code.indexOf('/* LEADER PHARMA V42 PROJECTION VISUELLE SANS\
        \ EFFACEMENT */',ra)),retry);\n const run=retry.lpV41RetryPending();retry.currentUser=null;release();await\
        \ run;assert.equal(flush,0);assert.equal(retry.lpOfflineV41,true);\n retry.currentUser=user;const success=retry.lpV41RetryPending();release();await\
        \ success;assert.equal(flush,1);assert.equal(retry.lpOfflineV41,false);\n console.log('PASS: recovery stops\
        \ after logout and resumes existing queue only for active session');\n assert(code.includes(\"path==='leader-pharma-login-v37'?30000:60000\"\
        ));\n assert(code.includes(\"error?.name==='TypeError'||error?.name==='AbortError'\"));\n assert(code.includes(\"\
        if(!data.ok){\"));\n console.log('PASS: longer transport allowance; explicit server refusal remains separate\
        \ from offline fallback');\n}\nmain().catch(e=>{console.error(e);process.exit(1)});\n\nJS\nnode /tmp/lp-web-reconnect-test.cjs\
        \ app.js\n"
    - name: Enregistrer les fichiers Web corriges
      run: "set -euo pipefail\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        git add .nojekyll app.js platform-update.js service-worker.js platform-manifest.json platform\nif ! git\
        \ diff --cached --quiet; then\n git commit -m 'Web V75: reprise de session apres reconnexion'\n git push\
        \ origin main\nfi"
    - name: Demander la publication Pages existante
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        # La source main/root est deja configuree. Ne pas modifier les reglages Pages.

        gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /tmp/lp-pages-build.json'
    - name: Verifier le correctif reellement publie
      shell: python
      run: "from pathlib import Path\nimport urllib.request,json,hashlib,time,os\nexpected=json.loads(Path('platform-manifest.json').read_text())\n\
        base='https://frilunga-gif.github.io/leader-pharma-web/'\nfor attempt in range(36):\n try:\n  suffix='?reconnexion='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)\n\
        \  request=urllib.request.Request(base+'platform-manifest.json'+suffix,headers={'Cache-Control':'no-cache'})\n\
        \  live=json.loads(urllib.request.urlopen(request,timeout=12).read())\n  if live.get('build')==expected['build']\
        \ and live.get('web_fix')==expected['web_fix']:\n   app=urllib.request.urlopen(base+'app.js'+suffix,timeout=30).read()\n\
        \   assert hashlib.sha256(app).hexdigest()==expected['files']['app.js']\n   print('WEB V75 RECONNEXION FIX1\
        \ PUBLIE ET VERIFIE')\n   break\n except Exception as error:\n  print('En attente de Pages : '+type(error).__name__)\n\
        \ time.sleep(5)\nelse:\n raise SystemExit('Publication non confirmee. Les fichiers sont enregistres ; consulter\
        \ le deploiement Pages.')"
