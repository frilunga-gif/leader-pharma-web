name: Leader Pharma F29.6.0.17 WEB DG.FR + ETAT ACHATS FIX59

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer depot Web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier base Web sans toucher Egress
        run: |
          set -euo pipefail

          test -s app.js
          test -s index.html
          test -s styles.css
          test -s dg-security.js

          node --check app.js
          node --check dg-security.js

          grep -Fq "LEADER PHARMA F29.6.0.17 SUPABASE EGRESS MAITRISE ACTIF" app.js
          grep -Fq "LEADER PHARMA F29.6.0.17 RESET DONNEES DG SEUL ACTIF" app.js
          grep -Fq "LEADER PHARMA F29.6.0.17 DG360 AGENCE STRICTE ACTIF" index.html
          grep -Fq "CENTRE DE CONTROLE DG 360 FINAL" index.html

          sha256sum app.js | awk '{print $1}' > /tmp/app.sha
          sha256sum styles.css | awk '{print $1}' > /tmp/styles.sha
          sha256sum dg-security.js | awk '{print $1}' > /tmp/security.sha

          echo "BASE WEB + EGRESS + SECURITE = OK"

      - name: Renommer uniquement affichage DG360 en DG.fr
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          marker = "LEADER PHARMA F29.6.0.17 WEB DG.FR VISIBLE ACTIF"

          replacements = [
              (
                  "setHeader('Centre de contrôle DG 360','Pilotage multi-agences • lecture seule • décisions rapides')",
                  "setHeader('DG.fr','Pilotage multi-agences • lecture seule • décisions rapides')"
              ),
              (
                  "t.textContent='Centre de contrôle DG 360'",
                  "t.textContent='DG.fr'"
              ),
              (
                  '<div class="lp360-badge">DG 360 • LECTURE SEULE</div>',
                  '<div class="lp360-badge">DG.fr • LECTURE SEULE</div>'
              ),
              (
                  "b.textContent='DG 360';",
                  "b.textContent='DG.fr';"
              ),
              (
                  "b.title='Centre de contrôle DG 360';",
                  "b.title='DG.fr • Centre de contrôle';"
              ),
          ]

          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit("Point DG.fr introuvable: " + old)

          if marker not in s:
              insert = "\n<!-- " + marker + " -->\n"
              if "</body>" not in s:
                  raise SystemExit("</body> introuvable")
              s = s.replace("</body>", insert + "</body>", 1)

          p.write_text(s, encoding="utf-8")

          out = p.read_text(encoding="utf-8")

          assert marker in out
          assert "b.textContent='DG.fr';" in out
          assert "b.title='DG.fr • Centre de contrôle';" in out
          assert '<div class="lp360-badge">DG.fr • LECTURE SEULE</div>' in out
          assert "setHeader('DG.fr','Pilotage multi-agences • lecture seule • décisions rapides')" in out

          # Les identifiants/fonctions internes DG360 restent volontairement intacts.
          assert "window.__LP_F296017_DG360_FINAL__" in out
          assert "LEADER PHARMA F29.6.0.17 DG360 AGENCE STRICTE ACTIF" in out

          print("AFFICHAGE DG.fr = OK")
          PY

      - name: Relever etat exact des achats Web
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          s = Path("app.js").read_text(encoding="utf-8", errors="replace")

          checks = [
              ("FIX46", "LEADER PHARMA F29.6.0.17 ACHAT APPROUVE STOCK CENTRAL FIX46 ACTIF"),
              ("FIX49", "LEADER PHARMA F29.6.0.17 ACHATS CIRCUIT BIDIRECTIONNEL FIX49 ACTIF"),
              ("FIX50", "LEADER PHARMA F29.6.0.17 ACHAT PROFESSIONNEL FIX50 ACTIF"),
              ("FIX51", "LEADER PHARMA F29.6.0.17 ACHAT MANUEL SAISIE FIX51 ACTIF"),
              ("FIX52", "LEADER PHARMA F29.6.0.17 FOURNISSEUR UTILISATEUR ENVOI CLAIR FIX52 ACTIF"),
              ("FIX53", "LEADER PHARMA F29.6.0.17 SAISIE MANUELLE VISIBLE FIX53 ACTIF"),
              ("FIX55C", "LEADER PHARMA F29.6.0.17 ACHAT MANUEL STABLE FINAL FIX55C ACTIF"),
              ("FIX56", "LEADER PHARMA F29.6.0.17 PRIX DETAIL DG NOUVEAU PRODUIT FIX56 ACTIF"),
              ("FIX57", "LEADER PHARMA F29.6.0.17 NOUVEAU PRODUIT STOCK FIX57 ACTIF"),
              ("FIX58", "LEADER PHARMA F29.6.0.17 VENTE ID PRODUIT MANUEL FIX58 ACTIF"),
              ("FIX59", "LEADER PHARMA F29.6.0.17 RETOUR DG SERVEUR FIX59 ACTIF"),
              ("EGRESS_WEB", "LEADER PHARMA F29.6.0.17 SUPABASE EGRESS MAITRISE ACTIF"),
              ("RESET_DG_ONLY", "LEADER PHARMA F29.6.0.17 RESET DONNEES DG SEUL ACTIF"),
              ("DG_QUOTA_FIX3", "LEADER PHARMA F29.6.0.17 DG QUOTA OFFLINE SECURE FIX3 ACTIF"),
          ]

          lines = [
              "LEADER PHARMA WEB - ETAT ACHATS / DG.FR",
              "Base F29.6.0.17",
              "",
          ]

          for name, marker in checks:
              lines.append(f"{name}={'PRESENT' if marker in s else 'ABSENT'}")

          Path("WEB-ACHATS-ETAT.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Controle strict aucune regression
        run: |
          set -euo pipefail

          node --check app.js
          node --check dg-security.js

          grep -Fq "LEADER PHARMA F29.6.0.17 WEB DG.FR VISIBLE ACTIF" index.html
          grep -Fq "DG.fr • LECTURE SEULE" index.html
          grep -Fq "b.textContent='DG.fr';" index.html

          grep -Fq "LEADER PHARMA F29.6.0.17 DG360 AGENCE STRICTE ACTIF" index.html
          grep -Fq "LEADER PHARMA F29.6.0.17 SUPABASE EGRESS MAITRISE ACTIF" app.js
          grep -Fq "LEADER PHARMA F29.6.0.17 RESET DONNEES DG SEUL ACTIF" app.js

          test "$(sha256sum app.js | awk '{print $1}')" = "$(cat /tmp/app.sha)"
          test "$(sha256sum styles.css | awk '{print $1}')" = "$(cat /tmp/styles.sha)"
          test "$(sha256sum dg-security.js | awk '{print $1}')" = "$(cat /tmp/security.sha)"

          test -s WEB-ACHATS-ETAT.txt

          echo "DG.fr = OK"
          echo "EGRESS = INCHANGE"
          echo "APP.JS = INCHANGE"
          echo "STYLES = INCHANGES"
          echo "SECURITE = INCHANGEE"

      - name: Publier DG.fr et etat achats
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Aucun changement a publier."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html WEB-ACHATS-ETAT.txt
          git commit -m "F29.6.0.17 Web DG.fr visible + etat achats FIX59"
          git push origin HEAD:main

          echo "WEB DG.fr = PUBLIE"
