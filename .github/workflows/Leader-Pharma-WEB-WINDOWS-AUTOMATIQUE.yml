name: Leader Pharma WEB WINDOWS SUIVRE MOTEUR ANDROID
'on':
  workflow_dispatch: {}
  schedule:
  - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: leader-pharma-web-publication
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Recuperer uniquement un nouveau moteur Android commun
      shell: python
      run: |
        from pathlib import Path
        import urllib.request,json,hashlib,zipfile,io,shutil,os,sys
        req=urllib.request.Request('https://dinainghufmsykambkyv.supabase.co/functions/v1/leader-pharma-master-update',headers={'x-leader-update':'LP-MASTER-PRO-2026','x-leader-current-version':'29.6.0.28'})
        meta=json.loads(urllib.request.urlopen(req,timeout=60).read())
        assert meta.get('ok') is True, 'MASTER indisponible'
        version=meta.get('technical_version','')
        parts=version.split('.')
        assert len(parts)==4 and all(p.isdigit() for p in parts), 'Version invalide'
        if tuple(map(int,parts))<(29,6,0,75):
         with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('changed=false\n')
         print('En attente du premier moteur commun Android 75. Web actuel conserve.')
         sys.exit(0)
        previous=json.loads(Path('platform-manifest.json').read_text()) if Path('platform-manifest.json').exists() else {}
        if previous.get('version')==version:
         with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('changed=false\n')
         print('Moteur deja publie : '+version)
         sys.exit(0)
        assert not previous.get('version') or tuple(map(int,previous['version'].split('.'))) < tuple(map(int,parts)), 'Retour de version refuse'
        build=2026300900+int(parts[-1])
        url=meta['download_url'];assert url.startswith('https://')
        data=urllib.request.urlopen(url,timeout=120).read()
        if meta.get('sha256'):assert hashlib.sha256(data).hexdigest()==meta['sha256']
        z=zipfile.ZipFile(io.BytesIO(data))
        r=Path('release-web');r.mkdir(exist_ok=True)
        for name in ['app.js','dg-security.js','styles.css','assets/leader-pharma-logo.png']:
         p=r/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read('assets/public/'+name))
        app=(r/'app.js').read_text();html=Path('index.html').read_text()
        assert version in app and 'V50 FIX6 RH ACTUALISATION' in app
        assert 'lpPhotoContinuityV74' in app
        assert 'V71 SUPPRESSION CIBLEE DEUX VENTES DG' in app and 'V72 PHOTOS POINTAGE SUPPRESSION DG' in app
        assert 'lpFix61RefreshPointage' not in html,'Ancien bouton RH interdit'
        if 'platform-update.js' not in html:html=html.replace('</head>','<script src="platform-update.js"></script>\n</head>',1)
        (r/'index.html').write_text(html)
        (r/'platform-update.js').write_text("/* Web/Windows updates: never reload an active operation. */\n(function(){\n 'use strict';\n const backupKey='lp_upgrade_backup_config_v43';\n if(!localStorage.getItem('lp_data_generation_v39')&&!localStorage.getItem(backupKey)){\n   const raw=localStorage.getItem('lpmp_v13')||localStorage.getItem('lpmp_v12');\n   if(raw){\n     // Fail closed if an archive cannot fit: do not run the generation reset.\n     localStorage.setItem(backupKey,JSON.stringify({date:new Date().toISOString(),raw}));\n   }\n }\n window.LP_PLATFORM_BUILD='72 / base Android validee';\n if(location.protocol==='https:'&&'serviceWorker' in navigator){\n   navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>{\n     function offer(){\n       if(!reg.waiting||document.getElementById('lp-platform-update'))return;\n       const b=document.createElement('button');b.id='lp-platform-update';\n       b.textContent='Nouvelle version disponible';b.style.cssText='position:fixed;bottom:64px;right:16px;z-index:99999;padding:12px;background:#0b6b4f;color:white;border-radius:10px';\n       b.onclick=()=>{if(confirm('Terminez et enregistrez vos opérations. Recharger maintenant ?')){\n         let once=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!once){once=true;location.reload();}});\n         reg.waiting.postMessage({type:'ACTIVATE'});\n       }};document.body.append(b);\n     }\n     offer();reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',offer);});\n     setInterval(()=>reg.update().catch(()=>{}),300000);\n   }).catch(()=>{});\n }\n // Intercept platform updates before legacy Android download handlers.\n document.addEventListener('click',async e=>{\n   const b=e.target.closest('button,a');if(!b)return;\n   if(!/Vérifier maintenant|Vérifier les mises à jour/i.test(b.textContent))return;\n   e.preventDefault();e.stopImmediatePropagation();\n   if(location.protocol==='file:'){\n     if(window.leaderPlatform)window.leaderPlatform.checkUpdates();\n     else alert('Mise à jour du moteur Windows requise.');\n   }else{\n     const reg=await navigator.serviceWorker?.getRegistration();\n     if(reg){await reg.update();if(reg.waiting)reg.waiting.postMessage({type:'SHOW'});}\n     alert(reg?.waiting?'Une nouvelle version est disponible. Utilisez le bouton de mise à jour.':'Vérification terminée. Les mises à jour seront proposées ici.');\n   }\n },true);\n})();\n",encoding='utf-8')
        (r/'service-worker.js').write_text("const CACHE_NAME='leader-pharma-web-v72';\nconst FILES=['./index.html','./app.js','./dg-security.js','./platform-update.js','./styles.css','./assets/leader-pharma-logo.png'];\nself.addEventListener('install',e=>e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(FILES))));\nself.addEventListener('message',e=>{if(e.data?.type==='ACTIVATE')self.skipWaiting();});\nself.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('leader-pharma-web-')&&k!==CACHE_NAME).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));\nself.addEventListener('fetch',e=>{\n if(e.request.method!=='GET'||new URL(e.request.url).origin!==self.location.origin)return;\n const url=new URL(e.request.url),base=new URL('./',self.location.href);\n const rel=url.pathname.slice(base.pathname.length);\n if(e.request.mode==='navigate'){e.respondWith(caches.open(CACHE_NAME).then(c=>c.match('./index.html')).then(r=>r||fetch(e.request)));return;}\n if(FILES.includes('./'+rel)){e.respondWith(caches.open(CACHE_NAME).then(c=>c.match('./'+rel)).then(r=>r||fetch(e.request)));}\n});\n",encoding='utf-8')
        files=['index.html','app.js','dg-security.js','platform-update.js','styles.css','assets/leader-pharma-logo.png']
        m={'schema':1,'build':build,'version':version,'base':'Moteur commun Android Web Windows','files':{n:hashlib.sha256((r/n).read_bytes()).hexdigest() for n in files}}
        (r/'platform-manifest.json').write_text(json.dumps(m,indent=2))
        for p in r.iterdir():
         if p.is_file():shutil.copy2(p,p.name)
        shutil.copytree(r/'assets','assets',dirs_exist_ok=True)
        shutil.copytree(r,Path('platform')/str(m['build']),dirs_exist_ok=True)
        shutil.rmtree(r)

        # Le cache Web change pour chaque version du moteur.
        p=Path('service-worker.js');p.write_text(p.read_text().replace('leader-pharma-web-v72','leader-pharma-web-'+str(build)))
        p=Path('platform-update.js');p.write_text(p.read_text().replace('72 / base Android validee',version+' / moteur commun Android'))
        m['files']['platform-update.js']=hashlib.sha256(p.read_bytes()).hexdigest()
        Path('platform-manifest.json').write_text(json.dumps(m,indent=2))
        archive=Path('platform')/str(build)
        shutil.copy2(p,archive/'platform-update.js')
        shutil.copy2('platform-manifest.json',archive/'platform-manifest.json')
        with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('changed=true\n')
      id: prepare
    - name: Verifier JavaScript
      run: |-
        node --check app.js
        node --check dg-security.js
        node --check platform-update.js
        node --check service-worker.js
      if: steps.prepare.outputs.changed == 'true'
    - name: Publier fichiers sur main
      run: |-
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add index.html app.js dg-security.js platform-update.js service-worker.js styles.css assets platform platform-manifest.json
        if ! git diff --cached --quiet; then git commit -m 'Moteur commun depuis Android MASTER'; git push origin main; fi
      if: steps.prepare.outputs.changed == 'true'
    - uses: actions/upload-artifact@v4
      with:
        name: Leader-Pharma-Web-Windows-moteur-commun
        path: |-
          index.html
          app.js
          dg-security.js
          platform-update.js
          service-worker.js
          styles.css
          assets
          platform
          platform-manifest.json
      if: steps.prepare.outputs.changed == 'true'
    - name: Preparer publication Pages
      shell: python
      run: |-
        from pathlib import Path
        import shutil
        r=Path('_site');r.mkdir(exist_ok=True)
        for n in ['index.html','app.js','dg-security.js','platform-update.js','service-worker.js','styles.css','platform-manifest.json']:
         shutil.copy2(n,r/n)
        for n in ['assets','platform']:
         shutil.copytree(n,r/n,dirs_exist_ok=True)
        (r/'.nojekyll').touch()
      if: steps.prepare.outputs.changed == 'true'
    - uses: actions/configure-pages@v5
      if: steps.prepare.outputs.changed == 'true'
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
      if: steps.prepare.outputs.changed == 'true'
    - name: Publier Web maintenant
      id: deployment
      uses: actions/deploy-pages@v4
      if: steps.prepare.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
