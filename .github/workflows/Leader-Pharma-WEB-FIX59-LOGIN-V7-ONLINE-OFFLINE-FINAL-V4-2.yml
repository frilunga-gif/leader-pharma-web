name: Leader Pharma WEB FIX59 LOGIN V7 ONLINE OFFLINE FINAL V4

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  corriger_web:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer depot Web
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Identifier moteur Web V7
        run: |
          set -euo pipefail
          test -s index.html

          if [ -s app.js ]; then
            echo "app.js" > /tmp/lp-code-file.txt
          elif grep -Fq "function login()" index.html; then
            echo "index.html" > /tmp/lp-code-file.txt
          else
            echo "Moteur Web Leader Pharma introuvable."
            exit 1
          fi

          CODE="$(cat /tmp/lp-code-file.txt)"
          grep -Fq "WEB DG LOGIN LOCAL HORS LIGNE FINAL V2 ACTIF" "$CODE"
          grep -Fq "LP_DG_PASSWORD_SUPABASE_V5_START" "$CODE"
          grep -Fq "LP_DG_OFFLINE_SECURE_V7_START" "$CODE"
          echo "MOTEUR WEB V7 PRESENT = OK"

      - name: Retablir mot de passe Internet puis hors ligne V7
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(Path('/tmp/lp-code-file.txt').read_text().strip())
          code = path.read_text(encoding='utf-8')
          marker = 'LEADER PHARMA F29.6.0.17 WEB DG V7 ONLINE OFFLINE FINAL V4 ACTIF'

          if marker not in code:
              old = "  function lpIsDGV5(){\n\n    /* WEB V2: le login FIX59 local fonctionne avec ou sans Internet. */\n    return false;\n\n    const field =\n      lpUsernameFieldV5();"
              new = "  function lpIsDGV5(){\n\n    /* WEB V4: validation Supabase en ligne puis acces local hors ligne. */\n\n    const field =\n      lpUsernameFieldV5();"

              if code.count(old) != 1:
                  raise SystemExit('Bloc Web V2 attendu une fois, introuvable ou duplique')

              code = code.replace(old, new, 1)
              code += f'\n/* {marker} */\n'
              path.write_text(code, encoding='utf-8')
          PY

      - name: Controle final Web V4
        run: |
          set -euo pipefail
          CODE="$(cat /tmp/lp-code-file.txt)"

          grep -Fq "LEADER PHARMA F29.6.0.17 WEB DG V7 ONLINE OFFLINE FINAL V4 ACTIF" "$CODE"
          grep -Fq "LP_DG_PASSWORD_SUPABASE_V5_START" "$CODE"
          grep -Fq "LP_DG_OFFLINE_SECURE_V7_START" "$CODE"
          grep -Fq "lpSupabaseDGPasswordV5" "$CODE"
          grep -Fq "lpSynchronizeOnlyDGPasswordV5" "$CODE"
          grep -Fq "lpDGOfflineLoginV7" "$CODE"
          grep -Fq "leader_pharma_dg_password_v15" "$CODE"
          grep -Fq "RETOUR DG SERVEUR FIX59 ACTIF" "$CODE"
          grep -Fq "RESET DONNEES DG SEUL ACTIF" "$CODE"

          for required in "POINTAGE 24H" "exitPhoto" "row.exitDate"; do
            if ! grep -Fq "$required" "$CODE" index.html; then
              echo "Controle Web absent: $required"
              exit 1
            fi
          done

          if grep -Fq "WEB V2: le login FIX59 local fonctionne avec ou sans Internet." "$CODE"; then
            echo "Ancien bloc Web V2 encore actif."
            exit 1
          fi

          if [ "$CODE" = "app.js" ]; then
            node --check app.js
          else
            python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script' and not dict(attrs).get('src'):
                      self.inside = True
                      self.parts.append('')
              def handle_endtag(self, tag):
                  if tag.lower() == 'script':
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.parts[-1] += data

          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          Path('/tmp/web-inline.js').write_text('\n'.join(parser.parts), encoding='utf-8')
          PY
            node --check /tmp/web-inline.js
          fi

          echo "LOGIN AVEC INTERNET = VALIDATION SUPABASE"
          echo "MOT DE PASSE = MEMORISE LOCALEMENT"
          echo "LOGIN SANS INTERNET = MOTEUR SECURISE V7"
          echo "FIX59 / PHOTOS DEPART / MINUIT = CONSERVES"

      - name: Publier Web V4
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CODE="$(cat /tmp/lp-code-file.txt)"
          git add "$CODE"

          if git diff --cached --quiet; then
            echo "Web V4 deja installe."
          else
            git commit -m "Leader Pharma Web login V7 Internet puis hors ligne V4"
            git push origin HEAD:main
          fi

          echo "WEB FIX59 LOGIN V7 ONLINE OFFLINE FINAL V4 = PRET"
