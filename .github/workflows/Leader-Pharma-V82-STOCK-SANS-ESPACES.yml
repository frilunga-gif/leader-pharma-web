name: Leader Pharma V82 - Stock sans espaces blancs Android
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: leader-pharma-publication-unique
  cancel-in-progress: false
jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      VERSION: 29.6.0.82
      BUILD: '2026400083'
      CODE: '2026300985'
      FINAL_APK: LeaderPharmaManagerPro-ANDROID-V82-STOCK-STABLE.apk
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Verifier les fonctions serveur V80 sans lire les donnees metier
      env:
        SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        set -euo pipefail
        python3 - <<'PYCHECK'
        import json,os,urllib.request
        base='https://dinainghufmsykambkyv.supabase.co/rest/v1/'
        req=urllib.request.Request(base,headers={'apikey':os.environ['SERVICE'],'Authorization':'Bearer '+os.environ['SERVICE'],'Accept':'application/openapi+json'})
        with urllib.request.urlopen(req,timeout=30) as response:api=json.load(response)
        for name in ['lp_expense_confirm_v80','lp_cash_close_v80','lp_stock_history_v80']:
         assert '/rpc/'+name in api['paths'],'Fonction serveur absente: '+name
        print('API V80 disponibles')
        PYCHECK
    - name: Verifier le canal avant construction
      env:
        SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = frilunga-gif/leader-pharma-manager-android
        test -n "$SERVICE" || { echo 'Secret SUPABASE_SERVICE_ROLE_KEY requis pour publier la mise a jour' >&2; exit 1; }
    - name: Verifier la cle de signature
      env:
        KEY: ${{ secrets.LEADER_KEYSTORE_BASE64 }}
        PASSWORD: ${{ secrets.LEADER_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        for name in KEY PASSWORD; do
          if [ -z "${!name}" ]; then echo "Secret Android requis absent : $name" >&2; exit 1; fi
        done
    - name: Recuperer la V79 signee actuellement en service
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh release download leader-pharma-commun-79-validation --pattern 'LeaderPharmaManagerPro-ANDROID-V79-TRESORERIE-RH.apk' --dir base-download
        cp base-download/*.apk base.apk
        python3 - <<'PYBASE'
        from pathlib import Path
        import zipfile,hashlib
        assert hashlib.sha256(Path('base.apk').read_bytes()).hexdigest()=='f1b8f8d2ba45070ff54fd664cd60806558d3196fbfd2da9b85283eb7441c751a','APK source differente'
        with zipfile.ZipFile('base.apk') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('assets/public/app.js')).hexdigest()=='63f7f1269aa45c47569aed326499cc92577f94895ec42331f4b3ede8c3e2cf60', 'La base differe de l APK examine. Arret sans modification.'
            for name in z.namelist():
                if name.startswith('assets/public/') and not name.endswith('/'):
                    rel=Path(name).relative_to('assets/public')
                    assert '..' not in rel.parts
                    dest=Path('engine')/rel;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(z.read(name))
        PYBASE
    - name: Preparer les tests de compatibilite V79 sans changer le moteur
      shell: bash
      run: |
        set -euo pipefail
        cat > treasury79.js <<'TREASURY79'
        /* LP_V79_TREASURY_READONLY_AGENCY_RH */
        (function(){
        'use strict';
        const str=v=>String(v??'').trim(),norm=v=>str(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),num=v=>Number.isFinite(Number(v))?Number(v):0;
        const esc=v=>str(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const day=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Lubumbashi',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
        const currency=r=>['fc','cdf',''].includes(norm(r.currency||r.devise))?'CDF':['usd','$'].includes(norm(r.currency||r.devise))?'USD':str(r.currency||r.devise).toUpperCase();
        const cancelled=r=>['annulee','annule','cancelled','canceled'].includes(norm(r.status));
        const owner=r=>str(r.sellerUsername||r.username||r.rhUser||r.user||r.sellerUserId||r.userId||r.sellerName||r.seller||r.createdBy||r.name||'Agence');
        function paid(r){const total=Math.max(0,num(r.total??r.amount??r.grandTotal??r.totalAmount));return r.paidAmount!=null?Math.min(total,Math.max(0,num(r.paidAmount))):norm(r.payment).includes('credit')?0:total;}
        function legacySaleKey(r){return str(r.invoice)&&str(r.date)&&str(r.time)&&owner(r)!=='Agence'?'legacy-sale:'+JSON.stringify([norm(r.agency||r.agence),str(r.date),str(r.time),str(r.invoice),norm(owner(r)),currency(r),num(r.total??r.amount),paid(r)]):'';}
        function rowKey(kind,r){return str(r.id)?'id:'+str(r.id):kind==='sales'?legacySaleKey(r):'legacy:'+JSON.stringify(r);}
        function project(state,agency,options={}){
         const rows=[],seen=new Set(),notes=[],known=new Map(),a=norm(agency);let unresolved=0;
         const allowed=r=>norm(r.agency||r.agence)===a&&(!options.visible||options.visible(r));
         const date=r=>str(r.date||r.startDate).slice(0,10);
         const inPeriod=r=>(!options.start||date(r)>=options.start)&&(!options.end||date(r)<=options.end);
         function add(kind,r,amount,type,ref){
          if(!allowed(r)||!Number.isFinite(amount)||amount<=0)return;
          const id=str(r.id)||(kind==='Vente'?legacySaleKey(r):'');if(!id){if(inPeriod(r))unresolved++;return;}
          const k=kind+'|'+a+'|'+id;if(seen.has(k))return;seen.add(k);
          const row={id:k,date:date(r),agency:a,currency:currency(r),type,category:kind,desc:str(ref||r.desc||r.reason||r.ref),amount,agent:owner(r)};
          if(!/^\d{4}-\d{2}-\d{2}$/.test(row.date)){unresolved++;return;}
          known.set(k,row);if(inPeriod(r))rows.push(row);
         }
         const sales=(state.sales||[]).filter(allowed),saleById=new Map(sales.map(r=>[str(r.id),r]));
         const canonical=new Set(sales.filter(r=>str(r.id)).map(legacySaleKey).filter(Boolean));
         for(const r of sales)if(!cancelled(r)&&!( !str(r.id)&&canonical.has(legacySaleKey(r)) ))add('Vente',r,paid(r),'Entrée',r.invoice);
         for(const r of state.expenses||[])if(!cancelled(r))add('Dépense',r,Math.max(0,num(r.amount)),'Sortie');
         const batches=(state.purchaseBatches||[]).filter(allowed),batchIds=new Set(batches.map(r=>str(r.id)));
         for(const r of batches)if(!cancelled(r)){
          if(r.paidAmount!=null)add('Achat',r,Math.max(0,num(r.paidAmount)),'Sortie',r.ref);
          else if(inPeriod(r))unresolved++;
         }
         for(const r of state.purchases||[])if(!cancelled(r)&&!batchIds.has(str(r.sourceBatchId||r.batchId)))add('Achat',r,paid(r),'Sortie',r.ref);
         const refunded=new Map();
         for(const r of state.returns||[]){
          if(!allowed(r))continue;const sale=saleById.get(str(r.saleId));
          if(sale&&cancelled(sale))continue;
          if(!sale||currency(sale)!==currency(r)){if(inPeriod(r))unresolved++;continue;}
          const key=str(r.saleId),available=Math.max(0,paid(sale)-(refunded.get(key)||0)),amount=Math.min(available,Math.max(0,num(r.amount)));
          const seenId='Retour|'+a+'|'+str(r.id);if(seen.has(seenId))continue;
          add('Retour',r,amount,'Sortie',r.invoice);refunded.set(key,(refunded.get(key)||0)+amount);
         }
         // Keep legitimate independent manual cash movements. Linked automatic records never count twice.
         const nativeSeen=new Set();
         for(const r of state.treasury||[]){
          if(!allowed(r)||!inPeriod(r))continue;const id=str(r.id);if(!id||nativeSeen.has(id))continue;nativeSeen.add(id);
          const c=norm(r.category),kind=c.includes('vente')?(c.includes('retour')?'Retour':'Vente'):c.includes('achat')?'Achat':c.includes('depense')||c.includes('salaire')?'Dépense':null;
          if(kind){
           const source=str(r.sourceSaleId||r.saleId||r.sourceExpenseId||r.expenseId||r.sourceBatchId||r.sourcePurchaseId);
           const matches=source&&known.has(kind+'|'+a+'|'+source)||[...known.values()].some(x=>x.category===kind&&x.date===date(r)&&x.currency===currency(r)&&Math.abs(x.amount-num(r.amount))<0.005&&x.desc===str(r.desc));
           if(!matches)unresolved++;
           continue;
          }
          if(!['entree','sortie'].includes(norm(r.type))){unresolved++;continue;}
          add('Mouvement',r,Math.max(0,num(r.amount)),norm(r.type)==='entree'?'Entrée':'Sortie');
         }
         const totals={};for(const r of rows){const t=totals[r.currency]||(totals[r.currency]={in:0,out:0,balance:0});if(r.type==='Entrée')t.in+=r.amount;else t.out+=r.amount;t.balance=t.in-t.out;}
         return {rows:rows.sort((x,y)=>y.date.localeCompare(x.date)||x.id.localeCompare(y.id)),totals,unresolved};
        }
        let selectedDay=day(),all=false,lastRead='',flight=null;
        function render79(){
         if(page!=='treasury'||!currentUser||!allowed('treasury'))return;
         const dg=norm(currentUser.role)==='dg';
         const result=project(db,currentAgency,{start:all?null:selectedDay,end:all?null:selectedDay,visible:dg?null:r=>window.lpV42Visible(r,r.sellerUsername||r.seller?'sales':'expenses')});
         const content=document.getElementById('content');if(!content)return;
         setHeader('Trésorerie & caisse','Calcul depuis les opérations enregistrées — '+(all?'historique disponible':selectedDay));
         const money=(n,c)=>new Intl.NumberFormat('fr-CD',{maximumFractionDigits:2}).format(n)+' '+(c==='CDF'?'FC':c);
         const currencies=Object.keys(result.totals);if(!currencies.length)currencies.push('CDF');
         content.innerHTML='<section class="card" id="lpTreasury79"><h2>Trésorerie par agence</h2><p>Ventes encaissées, dépenses et mouvements identifiés. Les comptes des agents restent utilisables selon leur rotation.</p><div class="actions"><label>Date <input id="lpT79Date" type="date" value="'+esc(selectedDay)+'" '+(all?'disabled':'')+'></label><label><input id="lpT79All" type="checkbox" '+(all?'checked':'')+'> Tout l’historique disponible</label><button class="secondary" id="lpT79Refresh">Actualiser les données distantes</button></div><p id="lpT79State">'+esc(lastRead||'Lecture des données présentes sur cet appareil. Actualisez pour vérifier les opérations distantes.')+'</p>'+currencies.map(c=>{const t=result.totals[c]||{in:0,out:0,balance:0};return '<h3>'+esc(c)+'</h3><div class="grid kpis"><div class="card kpi"><div class="label">Entrées</div><div class="value">'+money(t.in,c)+'</div></div><div class="card kpi"><div class="label">Sorties</div><div class="value">'+money(t.out,c)+'</div></div><div class="card kpi"><div class="label">Solde calculé</div><div class="value">'+money(t.balance,c)+'</div></div></div>';}).join('')+'<p>Solde calculé sur les opérations disponibles pour la période. Il ne remplace pas un comptage physique ; une caisse d’ouverture non enregistrée et les règlements non détaillés ne sont pas reconstitués.</p>'+(result.unresolved?'<p><strong>'+result.unresolved+' mouvement(s) à rapprocher</strong> : montant non ajouté pour éviter un double comptage ou un encaissement supposé.</p>':'')+'<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Agent</th><th>Type</th><th>Origine</th><th>Référence / motif</th><th>Montant</th></tr></thead><tbody>'+result.rows.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc((db.users||[]).find(u=>[u.username,u.id,u.name].some(v=>norm(v)===norm(r.agent)))?.name||r.agent)+'</td><td>'+esc(r.type)+'</td><td>'+esc(r.category)+'</td><td>'+esc(r.desc)+'</td><td>'+money(r.amount,r.currency)+'</td></tr>').join('')+(result.rows.length?'':'<tr><td colspan="6">Aucun mouvement disponible pour cette période et cette agence.</td></tr>')+'</tbody></table></div></section>';
         document.getElementById('lpT79Date').onchange=e=>{selectedDay=e.target.value;render79();};
         document.getElementById('lpT79All').onchange=e=>{all=e.target.checked;render79();};
         document.getElementById('lpT79Refresh').onclick=refresh79;
        }
        async function refresh79(){
         if(flight)return flight;if(navigator.onLine===false){lastRead='Hors ligne : opérations locales conservées.';render79();return false;}
         const user=currentUser,agency=currentAgency;
         flight=(async()=>{try{
          document.getElementById('lpT79State').textContent='Réception des données du serveur…';
          const token=await window.lpGetSessionTokenV16();
          const res=await fetch(SUPABASE.url.replace(/\/$/,'')+'/rest/v1/rpc/lp_read_state_v32',{method:'POST',headers:{apikey:SUPABASE.key,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});
          if(!res.ok)throw Error('SERVER_'+res.status);const data=await res.json(),remote=data?.[0]?.contenu;if(!remote)throw Error('STATE_MISSING');
          if(currentUser!==user||currentAgency!==agency)return false;
          for(const k of ['sales','expenses','treasury','purchases','purchaseBatches','returns']){
           const m=new Map((db[k]||[]).map((r,i)=>[rowKey(k,r)||'local-unresolved:'+i,r]));for(const [i,r] of (remote[k]||[]).entries()){const key=rowKey(k,r)||'remote-unresolved:'+i;m.set(key,{...m.get(key),...r});}db[k]=[...m.values()];
          }
          lastRead='Données distantes reçues à '+new Date().toLocaleTimeString('fr-FR')+' ; opérations locales conservées.';render79();return true;
         }catch(e){lastRead='Réception non confirmée. Données locales conservées ; réessayez avec Internet.';render79();return false;}})();
         try{return await flight;}finally{flight=null;}
        }
        window.lpTreasury79={project,paid,refresh:refresh79};treasury=render79;window.treasury=render79;
        })();

        TREASURY79
        cat > patch79.py <<'PATCH79'
        from pathlib import Path
        import sys
        p=Path(sys.argv[1]);s=p.read_text()
        assert 'LP_V79_TREASURY_READONLY_AGENCY_RH' not in s
        old="        agency: v14Agency(),\n        type: type,"
        assert s.count(old)==1
        s=s.replace(old,"        agency: v14Agency(),\n        reportAgency: v14Agency(),\n        agencySchema: 78,\n        type: type,")
        # Server-stamped historical attribution wins a newer stale local copy; other requests keep existing timestamp merge.
        old="if(!old||stamp(r)>=stamp(old))result.set(str(r.id),Object.assign({},old||{},r));"
        assert s.count(old)==1
        s=s.replace(old,"if(!old||stamp(r)>=stamp(old)||k==='rhRequests'&&r.agencyCorrectionVersion===79)result.set(str(r.id),Object.assign({},old||{},r));")
        s+='\n'+Path(__file__).with_name('treasury79.js').read_text();p.write_text(s)

        PATCH79
        true # V79 est deja presente : ne pas reappliquer la correction
        cat > test79.cjs <<'TEST79'
        const fs=require('fs'),vm=require('vm'),assert=require('assert');
        const context={window:{},treasury(){},Intl,Date,console};vm.createContext(context);vm.runInContext(fs.readFileSync('treasury79.js','utf8'),context);
        const project=context.window.lpTreasury79.project;
        const sale=(id,agency,total=55000)=>({id,agency,date:'2026-10-25',total,payment:'Espèces',invoice:'LP-00001',sellerUsername:id});
        const expense={id:'e1',agency:'centre',date:'2026-10-25',amount:25000,desc:'frais',user:'comptable'};
        let state={sales:[sale('a','centre'),sale('b','kamina',100000)],expenses:[expense],treasury:[{id:'t1',agency:'centre',date:'2026-10-25',category:'Vente',type:'Entrée',desc:'LP-00001',amount:55000}]};
        let before=JSON.stringify(state),r=project(state,'centre');assert.equal(r.totals.CDF.balance,30000);assert.equal(r.rows.length,2);assert.equal(JSON.stringify(state),before);
        state.sales.push({...state.sales[0]});state.expenses.push({...expense});assert.equal(project(state,'centre').totals.CDF.balance,30000);
        assert.equal(project(state,'kamina').totals.CDF.balance,100000);
        state.sales.push({...sale('usd','centre',50),currency:'USD'});assert.equal(project(state,'centre').totals.USD.balance,50);assert.equal(project(state,'centre').totals.CDF.balance,30000);
        state.sales[0].payment='Crédit';state.sales[2].payment='Crédit';assert.equal(project(state,'centre').totals.CDF.balance,-25000);
        state.sales[0].paidAmount=10000;state.sales[2].paidAmount=10000;assert.equal(project(state,'centre').totals.CDF.balance,-15000);
        assert.equal(project(state,'centre',{start:'2026-10-24',end:'2026-10-24'}).rows.length,0);
        state.sales[0].status='Annulée';state.sales[2].status='Annulée';state.returns=[{id:'r1',saleId:'a',agency:'centre',date:'2026-10-25',amount:10000}];assert.equal(project(state,'centre').totals.CDF.balance,-25000);
        state.treasury.push({id:'manual',agency:'centre',date:'2026-10-25',type:'Entrée',category:'Apport DG',amount:2000});assert.equal(project(state,'centre').totals.CDF.balance,-23000);
        state.purchases=[{id:'p1',agency:'centre',date:'2026-10-25',total:1000,payment:'Crédit'}];assert.equal(project(state,'centre').totals.CDF.balance,-23000);
        const privateRows=project(state,'centre',{visible:r=>r.sellerUsername==='usd'});assert.equal(privateRows.rows.length,1);assert.equal(privateRows.rows[0].currency,'USD');
        if(fs.existsSync('financial-sample.json')){const sample=JSON.parse(fs.readFileSync('financial-sample.json'));for(const k in sample)sample[k]||=[];for(const a of ['centre','kamina']){const x=project(sample,a);console.log(a,JSON.stringify(x.totals),'mouvements',x.rows.length,'a rapprocher',x.unresolved);}}
        const legacy={agency:'centre',date:'2026-10-25',time:'12:30',invoice:'LP-LEGACY',seller:'Agent',total:500};
        assert.equal(project({sales:[legacy]},'centre').totals.CDF.balance,500);
        assert.equal(project({sales:[legacy,{...legacy}]},'centre').totals.CDF.balance,500);
        assert.equal(project({sales:[legacy,{...legacy,id:'canonical'}]},'centre').totals.CDF.balance,500);
        assert.equal(project({sales:[legacy,{...legacy,time:'12:31'}]},'centre').totals.CDF.balance,1000);
        console.log('Treasury79: agence, devises, credits, partiels, doublons, annulation, manuel, dates, droits, source immuable OK');

        TEST79
    - name: Ajouter stock confirme historique cloture heures et CSV
      shell: bash
      run: |
        set -euo pipefail
        cat > prefix.js <<'V80_PREFIX_JS'
        /* LP_V80_EARLY_TRANSPORT */
        (function(){
         const base=window.fetch.bind(window);window.__lpV80RawFetch=base;
         window.fetch=async function(input,init){
          const url=typeof input==='string'?input:input?.url||'';
          if(url.includes('/rpc/lp_merge_sale_v1')&&typeof init?.body==='string'){
           try{const body=JSON.parse(init.body);if(body.p_sale&&!body.p_sale.operationAt&&typeof db!=='undefined'){const local=(db.sales||[]).find(r=>String(r.id)===String(body.p_sale.id)&&String(r.agency)===String(body.p_sale.agency));if(local?.operationAt){body.p_sale.operationAt=local.operationAt;body.p_sale.operationTimeZone='Africa/Lubumbashi';init={...init,body:JSON.stringify(body)};}}}catch(e){}
          }
          const result=await base.call(this,input,init);
          if(result.ok&&url.includes('/rpc/lp_merge_sale_v1')&&typeof init?.body==='string'){
           try{const body=JSON.parse(init.body),data=await result.clone().json();if(data.ok&&!data.guard_noop&&body.p_sale&&typeof window.lpV80SaleAck==='function')window.lpV80SaleAck(body.p_sale);}catch(e){}
          }return result;
         };
         window.addEventListener('click',e=>{if(typeof window.lpV80Click==='function')window.lpV80Click(e);},true);
        })();

        V80_PREFIX_JS
        cat > stock-confirmed.js <<'V80_STOCK_CONFIRMED_JS'
        /* LP_WEB_WINDOWS_STOCK_CONFIRMED_V79_1
         * Platform adapter: isolated product RPCs; never restamp or send old business snapshots.
         */
        (function(){
         'use strict';
         if(window.lpStockConfirmedV79)return;
         const rawFetch=window.__lpV80RawFetch||window.fetch.bind(window),s=v=>String(v??'').trim(),n=v=>s(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
         const fields=['name','barcode','ean','lot','price','retailPrice','wholesalePrice','cost','min','expiry'];
         let draft=null,busy=false,reading=null,lastRead=0,lastAgency='',lastActor='';
         const actor=()=>typeof currentUser!=='undefined'?currentUser:null;
         const agency=()=>typeof currentAgency!=='undefined'?s(currentAgency):'';
         const dg=()=>n(actor()?.role)==='dg';
         const key=r=>n(r.agency)+'|'+s(r.id);
         const get=id=>document.getElementById(id);
         const tell=t=>{if(typeof toast==='function')toast(t);};
         function status(t){const el=get('lpStockConfirmedStatus');if(el)el.textContent=t;}
         function persist(){localStorage.setItem('lpmp_v13',JSON.stringify(db));}
         async function rpc(name,body,who){
          if(navigator.onLine===false)throw Error('Hors ligne. Saisie conservée.');
          const token=await window.lpGetSessionTokenV16();
          if(actor()!==who)throw Error('Le compte a changé. Rouvrez la fiche.');
          const base=SUPABASE.url.replace(/\/$/,'');
          async function call(path,payload,epoch){
           const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
           try{
            const headers={apikey:SUPABASE.key,Authorization:'Bearer '+token,'Content-Type':'application/json'};
            if(epoch!=null)headers['x-lp-data-generation']=String(epoch);
            const r=await rawFetch(base+'/rest/v1/rpc/'+path,{method:'POST',headers,body:JSON.stringify(payload),signal:controller.signal});
            const data=await r.json();if(!r.ok)throw Error(data.message||'Réception serveur non confirmée.');return data;
           }finally{clearTimeout(timer);}
          }
          // Read the generation for this isolated operation, not for a bulk snapshot.
          const epoch=await call('lp_data_generation_v39',{});
          if(!Number.isSafeInteger(Number(epoch))||Number(epoch)<1)throw Error('Vérification serveur impossible.');
          if(actor()!==who)throw Error('Le compte a changé.');
          return call(name,body,epoch);
         }
         function installRows(rows,a){
          const incoming=new Map(rows.filter(r=>n(r.agency)===n(a)).map(r=>[key(r),r]));
          // Keep local-only records intact. No automatic deletion or stock addition.
          db.products=(db.products||[]).map(r=>incoming.get(key(r))||r);
