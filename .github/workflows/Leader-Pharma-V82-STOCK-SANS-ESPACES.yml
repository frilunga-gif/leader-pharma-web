            archive.mkdir(parents=True)
            for name in files:
                dest=archive/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(stage/name,dest)
            shutil.copy2(stage/'platform-manifest.json',archive/'platform-manifest.json')
        worker="""const CACHE_NAME='leader-pharma-web-BUILD';
        const FILES=['./index.html','./app.js','./dg-security.js','./platform-update.js','./styles.css','./assets/leader-pharma-logo.png'];
        self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(FILES))));
        self.addEventListener('message',e=>{if(e.data?.type==='ACTIVATE')self.skipWaiting();});
        self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('leader-pharma-web-')&&k!==CACHE_NAME).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
        self.addEventListener('fetch',e=>{
          const u=new URL(e.request.url),base=new URL('./',self.location.href);
          if(e.request.method!=='GET'||u.origin!==base.origin)return;
          const rel=u.pathname.slice(base.pathname.length);
          if(e.request.mode==='navigate'){e.respondWith(caches.open(CACHE_NAME).then(c=>c.match('./index.html')).then(r=>r||fetch(e.request)));return;}
          if(FILES.includes('./'+rel))e.respondWith(caches.open(CACHE_NAME).then(c=>c.match('./'+rel)).then(r=>r||fetch(e.request)));
        });
        """
        (stage/'service-worker.js').write_text(worker.replace('BUILD',str(build)))
        (stage/'.nojekyll').touch()
    - name: Verifier JavaScript et construire APK
      run: |
        set -euo pipefail
        for f in app.js dg-security.js platform-update.js service-worker.js; do node --check "_site/$f"; done
        java -jar /tmp/apktool.jar b decoded -o unsigned.apk
        "$LP_ANDROID_TOOLS/zipalign" -f -p 4 unsigned.apk aligned.apk
    - name: Signer avec la cle Android permanente
      env:
        LEADER_KEYSTORE_BASE64: ${{ secrets.LEADER_KEYSTORE_BASE64 }}
        LEADER_KEYSTORE_PASSWORD: ${{ secrets.LEADER_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        trap 'rm -f leader.keystore' EXIT
        printf '%s' "$LEADER_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > leader.keystore
        SIGNER="$LP_ANDROID_TOOLS/apksigner"
        "$SIGNER" sign --ks leader.keystore --ks-key-alias leaderpharma --ks-pass env:LEADER_KEYSTORE_PASSWORD --key-pass env:LEADER_KEYSTORE_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL_APK" aligned.apk
        "$SIGNER" verify --verbose --print-certs "$FINAL_APK" > /tmp/final-cert.txt
        grep -Fiq '0369e21ba4b01689b177b3d0a4bcce2ba10c858790e4db0cb19eaebb5f69f0f2' /tmp/final-cert.txt
        "$LP_ANDROID_TOOLS/zipalign" -c -p 4 "$FINAL_APK"
        "$LP_ANDROID_TOOLS/aapt" dump badging "$FINAL_APK" > /tmp/final-badging.txt
        python3 - <<'PY'
        import zipfile,hashlib,re,os
        from pathlib import Path
        a=re.search(r"package: name='([^']+)'",Path('/tmp/base-badging.txt').read_text()).group(1)
        b=Path('/tmp/final-badging.txt').read_text()
        assert "package: name='"+a+"'" in b
        assert "versionName='"+os.environ['VERSION']+"'" in b
        assert "versionCode='"+os.environ['CODE']+"'" in b
        with zipfile.ZipFile(os.environ['FINAL_APK']) as z:
            assert z.testzip() is None
            assert z.read('assets/public/app.js')==Path('_site/app.js').read_bytes()
        PY
    - name: Deposer les fichiers signes sans modifier une version deja publiee
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG=leader-pharma-commun-82-validation
        if gh release view "$TAG" >/dev/null 2>&1; then
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
        else
          gh release create "$TAG" --draft --title 'Leader Pharma V82 - Stock sans espaces blancs Android' --notes 'V80 commune : stock confirme, historique des nouveaux mouvements, heures Lubumbashi, exports CSV stock et operations. Confirmation des ventes et depenses. Cloture indicative ouverture + ventes especes - depenses, hors autres mouvements. Historiques conserves.'
        fi
        (cd _site && zip -qr ../LeaderPharma-V82-MOTEUR-COMMUN.zip .)
        gh release upload "$TAG" "$FINAL_APK" LeaderPharma-V82-MOTEUR-COMMUN.zip --clobber
        printf 'APK signe depose dans Releases, brouillon : %s
        ' "$TAG" >> "$GITHUB_STEP_SUMMARY"
    - name: Verifier l APK final avant publication directe
      id: candidate
      shell: bash
      run: |
        cp "$FINAL_APK" candidate.apk
        set -euo pipefail
        "$LP_ANDROID_TOOLS/aapt" dump badging candidate.apk > badging.txt
        python3 - <<'VERSION'
        import re,os
        s=open('badging.txt').read();v=re.search(r"versionName='([^']+)'",s).group(1)
        assert re.fullmatch(r'29\.6\.0\.\d+',v),'Version invalide'
        eligible=tuple(map(int,v.split('.')))>(29,6,0,77)
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('eligible='+str(eligible).lower()+'\n')
        print('Version suivante a publier' if eligible else 'V77 ou anterieure : aucune modification')
        VERSION
        "$LP_ANDROID_TOOLS/apksigner" verify --print-certs candidate.apk > cert.txt
        grep -Fiq '0369e21ba4b01689b177b3d0a4bcce2ba10c858790e4db0cb19eaebb5f69f0f2' cert.txt
    - name: Activer V82 stock stable sur le canal commun
      if: steps.candidate.outputs.eligible == 'true'
      env:
        SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      shell: python
      run: |
        """Promote an already signed future APK. Never rebuild or edit the APK."""
        from pathlib import Path
        import hashlib,json,os,re,urllib.request,urllib.error,zipfile,datetime,sys

        BASE='https://dinainghufmsykambkyv.supabase.co'
        BUCKET='leader-pharma-updates-private'
        REQUIRED=['LP_V77_NOTES_AGENCY_START','LEADER PHARMA WEB V75 RECONNEXION FIX1','LEADER PHARMA WEB V75 FIX2 TARGET SENSIBLE','lpPhotoContinuityV74','V50 FIX6 RH ACTUALISATION']

        def version(value):
            assert re.fullmatch(r'29\.6\.0\.\d+',str(value)), 'Version technique inattendue'
            return tuple(map(int,value.split('.')))

        def inspect(apk,badging):
            m=re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",badging)
            assert m, 'Metadonnees APK absentes'
            package,code,v=m.groups();code=int(code)
            assert package=='org.leaderpharma.managerpro.v140dgsecurity1','Identite Android differente'
            assert code>2026300979,'Code Android doit depasser V77'
            assert version(v)>(29,6,0,77),'Versions en service V77 preservees : version suivante requise'
            with zipfile.ZipFile(apk) as z:
                assert z.testzip() is None
                codejs=z.read('assets/public/app.js').decode('utf-8')
                assert re.search(r"LP_INSTALLED_DISPLAY_VERSION\s*=\s*['\"]F"+re.escape(v)+r" MASTER PRO['\"]",codejs),'Version du moteur differente de celle de l APK'
                for marker in REQUIRED:assert marker in codejs, 'Compatibilite commune manquante : '+marker
                for name in ['dg-security.js','styles.css','assets/leader-pharma-logo.png']:assert z.read('assets/public/'+name)
            return v,code,hashlib.sha256(Path(apk).read_bytes()).hexdigest()

        def run():
            apk=Path('candidate.apk');raw=apk.read_bytes()
            v,code,digest=inspect(apk,Path('badging.txt').read_text())
            key=os.environ['SERVICE'];assert key,'Secret de publication absent'
            headers={'Authorization':'Bearer '+key,'apikey':key}
            def request(path,method='GET',body=None,extra=None):
                h={**headers,**(extra or {})};data=body
                if isinstance(body,(dict,list)):data=json.dumps(body).encode();h['Content-Type']='application/json'
                try:
                    with urllib.request.urlopen(urllib.request.Request(BASE+path,data=data,method=method,headers=h),timeout=120) as r:return r.read()
                except urllib.error.HTTPError as e:raise RuntimeError('Publication refusee HTTP '+str(e.code)) from None
            def api(path,method='GET',body=None):return json.loads(request('/rest/v1/'+path,method,body,{'Prefer':'return=representation'}))
            existing=api('lp_update_releases?channel=eq.stable&order=version_code.desc&limit=1')
            if existing:
                latest=existing[0]
                if latest.get('version_name')==v:assert int(latest['version_code'])==code and latest['sha256']==digest,'Version technique deja utilisee'
                assert int(latest['version_code'])<=code,'Retour de code refuse'
                if int(latest['version_code'])==code:
                    assert latest['sha256']==digest and latest['version_name']==v,'Code reutilise avec un autre APK'
                    if latest.get('is_active'):
                        print('APK deja actif ; aucune modification');return
            master=api('lp_master_release?channel=eq.stable')
            assert len(master)==1,'Canal MASTER unique requis'
            old=master[0].get('current_version','')
            oldmatch=re.search(r'29\.6\.0\.\d+',old)
            assert oldmatch and version(oldmatch.group())<=version(v),'Retour de version MASTER refuse'
            path='stable/'+str(code)+'/'+digest+'.apk'
            # Immutable content-addressed path. Retry checks the existing object's bytes first.
            try:stored=request('/storage/v1/object/authenticated/'+BUCKET+'/'+path)
            except RuntimeError as e:
                if str(e) not in ['Publication refusee HTTP 400','Publication refusee HTTP 404']:raise
                request('/storage/v1/object/'+BUCKET+'/'+path,'POST',raw,{'Content-Type':'application/vnd.android.package-archive','x-upsert':'false'})
                stored=request('/storage/v1/object/authenticated/'+BUCKET+'/'+path)
            assert hashlib.sha256(stored).hexdigest()==digest,'Controle APK distant echoue'
            notes='Publication unique Android ; Web et Windows reprennent le meme app.js sans transformation.'
            row={'channel':'stable','version_name':v,'version_code':code,'storage_bucket':BUCKET,'storage_path':path,'sha256':digest,'file_size_bytes':len(raw),'is_active':True,'is_mandatory':False,'release_notes':notes,'published_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            current=api('lp_update_releases?channel=eq.stable&version_code=eq.'+str(code))
            assert len(current)<=1,'Version dupliquee dans le canal'
            result=api('lp_update_releases?channel=eq.stable&version_code=eq.'+str(code),'PATCH',row) if current else api('lp_update_releases','POST',row)
            assert len(result)==1 and result[0]['sha256']==digest and result[0]['is_active'] is True
            result=api('lp_master_release?channel=eq.stable','PATCH',{'current_version':'F'+v+' MASTER PRO','title':'MASTER PRO moteur commun','notes':notes,'force_update':False,'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat()})
            assert len(result)==1
            req=urllib.request.Request(BASE+'/functions/v1/leader-pharma-master-update',headers={'x-leader-update':'LP-MASTER-PRO-2026','x-leader-current-version':'29.6.0.28'})
            with urllib.request.urlopen(req,timeout=60) as r:meta=json.load(r)
            assert meta.get('ok') is True and meta.get('technical_version')==v and meta.get('sha256')==digest,'Verification du canal echouee ; anciens fichiers conserves'
            api('lp_update_releases?channel=eq.stable&version_code=lt.'+str(code)+'&is_active=eq.true','PATCH',{'is_active':False})
            assert apk.read_bytes()==raw,'L APK local a change'
            print('Canal Android publie ; Web et Windows suivront automatiquement : '+v)

        if __name__=='__main__':run()
    - name: Publier la release stable apres confirmation du canal
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh release edit leader-pharma-commun-82-validation --draft=false --prerelease=false --latest
        printf '%s\n' 'V82 active sur le canal Android. Verifier maintenant peut la proposer. Web et Windows suivent automatiquement via le workflow installe.' >> "$GITHUB_STEP_SUMMARY"
