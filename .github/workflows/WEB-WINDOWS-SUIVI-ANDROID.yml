name: Leader Pharma SUIVI AUTOMATIQUE ANDROID - Web Windows FIX3 publication Pages
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/WEB-WINDOWS-SUIVI-ANDROID.yml
  schedule:
  - cron: '*/15 * * * *'
permissions:
  contents: write
  actions: write
  pages: write
concurrency:
  group: leader-pharma-web-publication
  cancel-in-progress: false
jobs:
  suivre:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verifier le depot et reserver un seul suiveur
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = frilunga-gif/leader-pharma-web\ngh api --paginate \"\
        repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100\" --jq '.workflows[] | [.path,.state] | @tsv' >\
        \ /tmp/lp-workflows.tsv\nfor file in Leader-Pharma-WEB-WINDOWS-AUTOMATIQUE.yml Leader-Pharma-WEB-WINDOWS-FIX1-PUBLICATION.yml;\
        \ do\n  state=\"$(awk -F '\\t' -v path=\".github/workflows/$file\" '$1==path {print $2}' /tmp/lp-workflows.tsv)\"\
        \n  if [ -z \"$state\" ]; then\n    echo \"Ancien workflow absent : $file\"\n    continue\n  fi\n  case\
        \ \"$state\" in\n    active)\n      gh workflow disable \"$file\" --repo \"$GITHUB_REPOSITORY\"\n      ;;\n\
        \    disabled_manually|disabled_inactivity|disabled_fork|deleted)\n      echo \"Ancien suiveur deja desactive\
        \ : $file\"\n      ;;\n    *)\n      echo \"Etat inattendu du workflow $file : $state\" >&2\n      exit\
        \ 1\n      ;;\n  esac\ndone\n"
    - name: Suivre uniquement une future version Android et garder V77 intacte
      id: prepare
      shell: python
      run: "\"\"\"Follow future Android releases without applying any application patch.\"\"\"\nfrom pathlib import\
        \ Path\nimport hashlib,json,os,re,urllib.request,urllib.parse,zipfile,io,shutil\n\nBASE='https://dinainghufmsykambkyv.supabase.co'\n\
        REQUIRED=['LP_V77_NOTES_AGENCY_START','LEADER PHARMA WEB V75 RECONNEXION FIX1','LEADER PHARMA WEB V75 FIX2\
        \ TARGET SENSIBLE','lpPhotoContinuityV74','V50 FIX6 RH ACTUALISATION']\nFILES=['index.html','app.js','dg-security.js','platform-update.js','styles.css','assets/leader-pharma-logo.png']\n\
        def version(v):\n    assert re.fullmatch(r'29\\.6\\.0\\.\\d+',str(v)), 'Version inattendue'\n    return\
        \ tuple(map(int,v.split('.')))\n\ndef classify(meta,current):\n    assert meta.get('ok') is True,'Canal\
        \ Android indisponible'\n    v=meta.get('technical_version');ver=version(v)\n    if ver<=(29,6,0,77) or\
        \ ver<=version(current['version']):return False\n    assert re.fullmatch(r'[a-fA-F0-9]{64}',str(meta.get('sha256',''))),'Empreinte\
        \ Android requise'\n    url=urllib.parse.urlsplit(meta['download_url'])\n    assert url.scheme=='https'\
        \ and url.hostname=='dinainghufmsykambkyv.supabase.co' and url.path.startswith('/storage/v1/object/'),'Adresse\
        \ APK non autorisee'\n    return True\n\ndef prepare(meta,current,apk):\n    assert classify(meta,current)\n\
        \    assert hashlib.sha256(apk).hexdigest().lower()==meta['sha256'].lower(),'Empreinte APK incorrecte'\n\
        \    with zipfile.ZipFile(io.BytesIO(apk)) as z:\n        assert z.testzip() is None\n        app=z.read('assets/public/app.js')\n\
        \        text=app.decode('utf-8')\n        for marker in REQUIRED:assert marker in text,'Compatibilite commune\
        \ manquante : '+marker\n        data={name:z.read('assets/public/'+name) for name in ['app.js','dg-security.js','styles.css','assets/leader-pharma-logo.png']}\n\
        \    # Only the web host shell remains platform-specific. Application bytes are identical.\n    r=Path('_next');assert\
        \ not r.exists();r.mkdir()\n    for name in FILES:\n        dest=r/name;dest.parent.mkdir(parents=True,exist_ok=True)\n\
        \        if name in data:dest.write_bytes(data[name])\n        else:shutil.copy2(name,dest)\n    shutil.copy2('service-worker.js',r/'service-worker.js')\n\
        \    build=max(int(current['build'])+1,2026400000+version(meta['technical_version'])[-1])\n    p=r/'service-worker.js';worker,n=re.subn(r\"\
        const CACHE_NAME='leader-pharma-web-[^']+';\",\"const CACHE_NAME='leader-pharma-web-\"+str(build)+\"';\"\
        ,p.read_text(),count=1);assert n==1;p.write_text(worker)\n    m={'schema':1,'build':build,'version':meta['technical_version'],'base':'Android\
        \ MASTER - app.js identique','source_apk_sha256':meta['sha256'].lower(),'files':{f:hashlib.sha256((r/f).read_bytes()).hexdigest()\
        \ for f in FILES}}\n    (r/'platform-manifest.json').write_text(json.dumps(m,indent=2))\n    assert (r/'app.js').read_bytes()==app\n\
        \    archive=Path('platform')/str(build);assert not archive.exists(),'Archive immuable deja presente'\n\
        \    archive.mkdir(parents=True)\n    for name in FILES+['service-worker.js','platform-manifest.json']:\n\
        \        dest=archive/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(r/name,dest)\n   \
        \     dest=Path(name);dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(r/name,dest)\n    shutil.rmtree(r);Path('.nojekyll').touch()\n\
        \    return m\n\ndef run():\n    current=json.loads(Path('platform-manifest.json').read_text())\n    for\
        \ name,digest in current['files'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,'Moteur\
        \ local incoherent : '+name\n    req=urllib.request.Request(BASE+'/functions/v1/leader-pharma-master-update',headers={'x-leader-update':'LP-MASTER-PRO-2026','x-leader-current-version':current['version']})\n\
        \    with urllib.request.urlopen(req,timeout=60) as r:meta=json.load(r)\n    changed=classify(meta,current)\n\
        \    if changed:\n        with urllib.request.urlopen(meta['download_url'],timeout=120) as r:\n        \
        \    apk=r.read(64*1024*1024+1)\n        assert len(apk)<=64*1024*1024,'APK trop volumineux'\n        m=prepare(meta,current,apk)\n\
        \        print('Moteur Android recopie sans modification : '+m['version'])\n    else:print('Aucune version\
        \ suivante : versions actuellement en service conservees')\n    with open(os.environ['GITHUB_OUTPUT'],'a')\
        \ as f:f.write('changed='+str(changed).lower()+'\\n')\n\nif __name__=='__main__':run()\n"
    - name: Verifier le moteur commun et ses empreintes
      if: steps.prepare.outputs.changed == 'true'
      run: "set -euo pipefail\nnode --check app.js\nnode --check dg-security.js\nnode --check platform-update.js\n\
        node --check service-worker.js\npython3 - <<'VERIFY'\nimport json,hashlib\nfrom pathlib import Path\nm=json.loads(Path('platform-manifest.json').read_text());archive=Path('platform')/str(m['build'])\n\
        for name,digest in m['files'].items():\n assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest\n\
        \ assert Path(name).read_bytes()==(archive/name).read_bytes()\nVERIFY\n"
    - name: Publier uniquement les fichiers du moteur suivant
      if: steps.prepare.outputs.changed == 'true'
      run: 'set -euo pipefail

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add .nojekyll index.html app.js dg-security.js platform-update.js styles.css assets/leader-pharma-logo.png
        service-worker.js platform platform-manifest.json

        if ! git diff --cached --quiet; then git commit -m ''Moteur commun depuis publication Android unique'';
        git push origin HEAD:main; fi

        '
    - name: Confirmer ou relancer Pages sans changer ses reglages
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n# Read existing settings only. Changing Pages settings requires administration permissions.\n\
        gh api \"repos/$GITHUB_REPOSITORY/pages\" > /tmp/pages-settings.json\npython3 - <<'SETTINGS'\nimport json\n\
        m=json.load(open('/tmp/pages-settings.json'))\nassert m.get('build_type')=='legacy' and m.get('source',{}).get('branch')=='main'\
        \ and m.get('source',{}).get('path')=='/', 'Pages doit deja publier depuis main / ; verifier Settings >\
        \ Pages sans modifier le moteur.'\nSETTINGS\npython3 - <<'PENDING'\nimport json,urllib.request,os\nfrom\
        \ pathlib import Path\nm=json.loads(Path('platform-manifest.json').read_text())\nbase='https://frilunga-gif.github.io/leader-pharma-web/'\n\
        ready=False\ntry:\n req=urllib.request.Request(base+'platform-manifest.json?verify='+os.environ['GITHUB_RUN_ID'],headers={'Cache-Control':'no-cache'})\n\
        \ with urllib.request.urlopen(req,timeout=20) as r:live=json.load(r)\n ready=live.get('version')==m['version']\
        \ and live.get('build')==m['build'] and live.get('files')==m['files']\nexcept Exception:pass\nPath('/tmp/lp-pages-ready').write_text('yes'\
        \ if ready else 'no')\nPENDING\nif [ \"$(cat /tmp/lp-pages-ready)\" != yes ]; then\n  gh api --method POST\
        \ \"repos/$GITHUB_REPOSITORY/pages/builds\" > /tmp/pages-build.json\nfi\npython3 - <<'VERIFY'\nimport urllib.request,json,time,os,hashlib\n\
        from pathlib import Path\nexpected=json.loads(Path('platform-manifest.json').read_text())\nbase='https://frilunga-gif.github.io/leader-pharma-web/'\n\
        for attempt in range(48):\n try:\n  suffix='?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)\n  req=urllib.request.Request(base+'platform-manifest.json'+suffix,headers={'Cache-Control':'no-cache'})\n\
        \  with urllib.request.urlopen(req,timeout=20) as r:live=json.load(r)\n  if live.get('version')==expected['version']\
        \ and live.get('build')==expected['build'] and live.get('files')==expected['files']:\n   for name,digest\
        \ in expected['files'].items():\n    with urllib.request.urlopen(base+name+suffix,timeout=30) as r:raw=r.read()\n\
        \    assert hashlib.sha256(raw).hexdigest()==digest,'Fichier public incoherent : '+name\n   print('WEB ET\
        \ WINDOWS : moteur '+expected['version']+' reellement publie et toutes empreintes verifiees')\n   break\n\
        \ except Exception as error:print('Verification publication : '+type(error).__name__)\n time.sleep(5)\n\
        else:raise SystemExit('Publication Pages non confirmee. Le moteur du depot est conserve ; relancer ce suivi\
        \ pour reprendre la publication.')\nVERIFY\n"
