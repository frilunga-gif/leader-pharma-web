name: Leader Pharma SUIVI ANDROID - Web Windows FIX6 Achats
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/WEB-WINDOWS-SUIVI-ANDROID.yml
  schedule:
  - cron: '*/15 * * * *'
permissions:
  contents: write
  actions: write
  pages: write
concurrency:
  group: leader-pharma-web-publication
  cancel-in-progress: false
jobs:
  suivre:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verifier le depot et conserver un seul suiveur
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = frilunga-gif/leader-pharma-web
        gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --jq '.workflows[] | [.path,.state] | @tsv' > /tmp/lp-workflows.tsv
        for file in Leader-Pharma-WEB-WINDOWS-AUTOMATIQUE.yml Leader-Pharma-WEB-WINDOWS-FIX1-PUBLICATION.yml; do
         state="$(awk -F '\t' -v path=".github/workflows/$file" '$1==path {print $2}' /tmp/lp-workflows.tsv)"
         case "$state" in
          active) gh workflow disable "$file" --repo "$GITHUB_REPOSITORY" ;;
          ''|disabled_manually|disabled_inactivity|disabled_fork|deleted) echo "Ancien suiveur absent ou desactive : $file" ;;
          *) echo "Etat inattendu : $state" >&2;exit 1 ;;
         esac
        done
    - name: Preparer le correctif cible et ses tests
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'FILES'
        import json,base64
        from pathlib import Path
        files=json.loads('{"follow.py": "", "adapter-test.cjs": "", "test_follow.py": ""}')
        for name,data in files.items():
         p=Path('/tmp/lp-purchase-fix6')/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(data))
        FILES
    - name: Suivre Android et corriger seulement ladaptateur achats Web Windows
      id: prepare
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/lp-purchase-fix6/follow.py
    - name: Verifier le moteur intact et le vrai gestionnaire de stock
      if: steps.prepare.outputs.changed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        node --check app.js
        node --check dg-security.js
        node --check platform-update.js
        node --check service-worker.js
        LP_TEST_APP=app.js LP_TEST_ADAPTER=platform-update.js python3 /tmp/lp-purchase-fix6/test_follow.py
        npm install --prefix /tmp/lp-web-purchase-tests jsdom@26.1.0 --no-audit --no-fund
        node /tmp/lp-purchase-fix6/adapter-test.cjs platform-update.js app.js
        python3 - <<'VERIFY'
        from pathlib import Path
        import hashlib,json
        m=json.loads(Path('platform-manifest.json').read_text());archive=Path('platform')/str(m['build'])
        assert m['platform_adapter_revision']=='LP_WEB_WINDOWS_PURCHASES_ADAPTER_FIX6'
        for name,h in m['files'].items():
         assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h
         assert Path(name).read_bytes()==(archive/name).read_bytes()
        VERIFY
    - name: Publier les fichiers verifies
      if: steps.prepare.outputs.changed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add .nojekyll index.html app.js dg-security.js platform-update.js styles.css assets/leader-pharma-logo.png service-worker.js platform platform-manifest.json
        if ! git diff --cached --quiet; then
         git commit -m 'FIX6 achats Web Windows : adaptateur atomique, moteur Android intact'
         git push origin HEAD:main
        fi
    - name: Confirmer Pages et les fichiers publics sans changer ses reglages
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/pages-settings.json
        python3 - <<'SETTINGS'
        import json
        m=json.load(open('/tmp/pages-settings.json'))
        assert m.get('build_type')=='legacy' and m.get('source',{}).get('branch')=='main' and m.get('source',{}).get('path')=='/', 'Pages doit deja publier depuis main / ; reglages conserves.'
        SETTINGS
        python3 - <<'PENDING'
        import json,urllib.request,os
        from pathlib import Path
        m=json.loads(Path('platform-manifest.json').read_text());ready=False
        try:
         req=urllib.request.Request('https://frilunga-gif.github.io/leader-pharma-web/platform-manifest.json?verify='+os.environ['GITHUB_RUN_ID'],headers={'Cache-Control':'no-cache'})
         with urllib.request.urlopen(req,timeout=20) as r:live=json.load(r)
         ready=all(live.get(k)==m.get(k) for k in ['version','build','files','platform_adapter_revision'])
        except Exception:pass
        Path('/tmp/lp-pages-ready').write_text('yes' if ready else 'no')
        PENDING
        if [ "$(cat /tmp/lp-pages-ready)" != yes ]; then
         gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /tmp/pages-build.json
        fi
        python3 - <<'PUBLIC'
        import json,urllib.request,os,hashlib,time
        from pathlib import Path
        expected=json.loads(Path('platform-manifest.json').read_text());base='https://frilunga-gif.github.io/leader-pharma-web/'
        for attempt in range(48):
         try:
          suffix='?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
          req=urllib.request.Request(base+'platform-manifest.json'+suffix,headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=20) as r:live=json.load(r)
          if all(live.get(k)==expected.get(k) for k in ['version','build','files','platform_adapter_revision']):
           for name,digest in expected['files'].items():
            with urllib.request.urlopen(base+name+suffix,timeout=30) as r:raw=r.read()
            assert hashlib.sha256(raw).hexdigest()==digest,'Fichier public incoherent : '+name
           with urllib.request.urlopen(base+'service-worker.js'+suffix,timeout=30) as r:worker=r.read()
           assert worker==Path('service-worker.js').read_bytes(),'Cache public non confirme'
           with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('FIX6 achats Web/Windows publie et empreintes publiques verifiees. Version Android '+expected['version']+' conservee, revision plateforme '+str(expected['build'])+'. Accepter la mise a jour proposee puis reouvrir le stock. Aucun stock ni achat historique modifie par ce workflow. Les huit entrees Kamina deja manquantes restent a rapprocher separement, sans ressaisie du stock.\n')
           print('WEB WINDOWS : adaptateur achats FIX6 et moteur commun reellement publies');break
         except Exception as error:print('Verification publication : '+type(error).__name__)
         time.sleep(5)
        else:raise SystemExit('Publication Pages non confirmee. Relancer ce suivi pour reprendre.')
        PUBLIC
