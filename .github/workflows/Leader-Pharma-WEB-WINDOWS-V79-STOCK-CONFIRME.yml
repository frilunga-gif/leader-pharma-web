name: Leader Pharma V79 STOCK CONFIRME - Web et Windows
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: leader-pharma-web-publication
  cancel-in-progress: false
jobs:
  corriger:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verifier le depot Web
      run: test "$GITHUB_REPOSITORY" = frilunga-gif/leader-pharma-web
    - name: Preparer et tester le correctif
      run: |
        mkdir -p tests/stock-confirmed-v79
        cat > tests/stock-confirmed-v79/stock-confirmed.js <<'LPSTOCK'
        /* LP_WEB_WINDOWS_STOCK_CONFIRMED_V79_1
         * Platform adapter: isolated product RPCs; never restamp or send old business snapshots.
         */
        (function(){
         'use strict';
         const rawFetch=window.fetch.bind(window),s=v=>String(v??'').trim(),n=v=>s(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
         const fields=['name','barcode','ean','lot','price','retailPrice','wholesalePrice','cost','min','expiry'];
         let draft=null,busy=false,reading=null,lastRead=0,lastAgency='',lastActor='';
         const actor=()=>typeof currentUser!=='undefined'?currentUser:null;
         const agency=()=>typeof currentAgency!=='undefined'?s(currentAgency):'';
         const dg=()=>n(actor()?.role)==='dg';
         const key=r=>n(r.agency)+'|'+s(r.id);
         const get=id=>document.getElementById(id);
         const tell=t=>{if(typeof toast==='function')toast(t);};
         function status(t){const el=get('lpStockConfirmedStatus');if(el)el.textContent=t;}
         function persist(){localStorage.setItem('lpmp_v13',JSON.stringify(db));}
         async function rpc(name,body,who){
          if(navigator.onLine===false)throw Error('Hors ligne. Saisie conservée.');
          const token=await window.lpGetSessionTokenV16();
          if(actor()!==who)throw Error('Le compte a changé. Rouvrez la fiche.');
          const base=SUPABASE.url.replace(/\/$/,'');
          async function call(path,payload,epoch){
           const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
           try{
            const headers={apikey:SUPABASE.key,Authorization:'Bearer '+token,'Content-Type':'application/json'};
            if(epoch!=null)headers['x-lp-data-generation']=String(epoch);
            const r=await rawFetch(base+'/rest/v1/rpc/'+path,{method:'POST',headers,body:JSON.stringify(payload),signal:controller.signal});
            const data=await r.json();if(!r.ok)throw Error(data.message||'Réception serveur non confirmée.');return data;
           }finally{clearTimeout(timer);}
          }
          // Read the generation for this isolated operation, not for a bulk snapshot.
          const epoch=await call('lp_data_generation_v39',{});
          if(!Number.isSafeInteger(Number(epoch))||Number(epoch)<1)throw Error('Vérification serveur impossible.');
          if(actor()!==who)throw Error('Le compte a changé.');
          return call(name,body,epoch);
         }
         function installRows(rows,a){
          const incoming=new Map(rows.filter(r=>n(r.agency)===n(a)).map(r=>[key(r),r]));
          // Keep local-only records intact. No automatic deletion or stock addition.
          db.products=(db.products||[]).map(r=>incoming.get(key(r))||r);
          const existing=new Set(db.products.map(key));
          for(const r of incoming.values())if(!existing.has(key(r))){db.products.push(r);existing.add(key(r));}
          persist();
         }
         async function read(force=false){
          if(reading)return reading;
          const who=actor(),a=agency();if(!who||!a)return false;
          if(!force&&lastActor===s(who.id||who.username)&&lastAgency===a&&Date.now()-lastRead<60000)return true;
          reading=(async()=>{
           status('Réception du stock…');
           try{
            const data=await rpc('lp_read_state_v32',{},who);
            if(actor()!==who||agency()!==a)return false;
            const state=Array.isArray(data)?data[0]?.contenu:null;
            if(!state||!Array.isArray(state.products))throw Error('Catalogue non confirmé.');
            installRows(state.products,a);lastRead=Date.now();lastAgency=a;lastActor=s(who.id||who.username);
            if(typeof page!=='undefined'&&page==='stock'&&!get('pname')&&typeof drawStock==='function')drawStock(get('stockSearch')?.value||'');
            status('Stock reçu du serveur.');return true;
           }catch(e){status('Stock local conservé. Réception non confirmée.');return false;}
          })();try{return await reading;}finally{reading=null;}
         }
         function open(id){
          if(!dg()){tell('Modification réservée au DG.');return;}
          const p=(db.products||[]).find(r=>s(r.id)===s(id)&&n(r.agency)===n(agency()));
          draft={id:p?.id??uid(),agency:agency(),prior:p?structuredClone(p):null,attempted:false};
         }
         function product(){
          const value=id=>s(get(id)?.value),num=id=>Number(value(id));
          if(!draft||draft.agency!==agency())throw Error('Rouvrez la fiche du produit.');
          const r={id:draft.id,agency:draft.agency,name:value('pname'),lot:value('plot'),barcode:value('pbarcode'),ean:value('pbarcode'),price:num('pprice'),retailPrice:num('pprice'),wholesalePrice:num('pwholesale'),cost:num('pcost'),stock:num('pstock'),min:num('pmin'),expiry:value('pexp')||draft.prior?.expiry||''};
          if(!r.name||!Number.isSafeInteger(r.stock)||r.stock<0||['price','wholesalePrice','cost','min'].some(k=>!Number.isFinite(r[k])||r[k]<0))throw Error('Vérifiez le nom, les quantités et les prix.');
          return r;
         }
         function duplicate(r,rows){return rows.find(x=>n(x.agency)===n(r.agency)&&s(x.id)!==s(r.id)&&((r.barcode&&s(x.barcode||x.ean)===r.barcode)||(n(x.name)===n(r.name)&&n(x.lot)===n(r.lot)&&s(x.expiry)===s(r.expiry))));}
         async function saveProduct(button){
          if(busy)return false;if(!dg()){tell('Modification réservée au DG.');return false;}
          let p;try{p=product();}catch(e){tell(e.message);return false;}
          const formDraft=draft,who=actor();busy=true;button.disabled=true;const label=button.textContent;button.textContent='Confirmation serveur…';
          try{
           // Preflight uses the server catalogue, not a potentially stale local list.
           const data=await rpc('lp_read_state_v32',{},who),rows=data?.[0]?.contenu?.products;
           if(!Array.isArray(rows))throw Error('Catalogue non confirmé. Saisie conservée.');
           if(actor()!==who||draft!==formDraft||agency()!==p.agency)throw Error('La fiche ou le compte a changé.');
           const previous=rows.find(x=>key(x)===key(p));
           if(!formDraft.prior&&duplicate(p,rows))throw Error('Ce produit et ce lot existent déjà. Utilisez Modifier ou Réception de stock.');
           let result;
           // A new-product retry keeps its original ID after a lost HTTP response.
           if(!formDraft.prior&&previous){
            if(!formDraft.attempted||fields.some(k=>s(previous[k])!==s(p[k])))throw Error('Produit déjà présent. Actualisez avant de modifier.');
            result=previous;
           }else{
            const expected=formDraft.prior?.stock??null;
            formDraft.attempted=true;
            result=await rpc('lp_save_product_dg_v41',{p_product:p,p_expected_stock:expected,p_change_stock:!formDraft.prior||p.stock!==Number(expected)},who);
           }
           if(key(result)!==key(p)||!Number.isSafeInteger(Number(result.stock)))throw Error('Produit non confirmé. Saisie conservée.');
           if(actor()!==who||draft!==formDraft||agency()!==p.agency)throw Error('Produit reçu au serveur. Rouvrez le stock du compte concerné.');
           installRows([result],p.agency);draft=null;lastRead=0;
           const form=get('stockForm');if(form)form.replaceChildren();
           if(typeof drawStock==='function')drawStock(get('stockSearch')?.value||'');
           status('Produit confirmé au serveur.');tell('Produit confirmé au serveur.');return true;
          }catch(e){
           const message=s(e.message).includes('STOCK_CHANGED_REFRESH')?'Une vente a modifié ce stock. Saisie conservée : actualisez et rouvrez la fiche.':'Enregistrement non confirmé. '+(e.name==='AbortError'?'Délai dépassé. Réessayez : le même identifiant sera conservé.':e.message);
           status(message);tell(message);return false;
          }finally{busy=false;button.disabled=false;button.textContent=label;}
         }
         function click(e){
          if(typeof page==='undefined'||page!=='stock')return false;
          const b=e.target?.closest?.('#saveProduct,[data-edit],#newProduct,#lpStockConfirmedRefresh');if(!b)return false;
          if(b.id==='lpStockConfirmedRefresh'){e.preventDefault();e.stopImmediatePropagation();if(!get('pname'))read(true);else tell('Terminez la fiche avant d’actualiser.');return true;}
          if(b.id==='saveProduct'){
           e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();saveProduct(b);return true;
          }
          return false;
         }
         // Registered before app.js and all legacy click observers.
         window.addEventListener('click',click,true);
         function mount(){
          if(typeof page==='undefined'||page!=='stock'||!actor())return;
          const table=get('stockTable');if(!table||get('lpStockConfirmedRefresh'))return;
          const box=document.createElement('div');box.innerHTML='<button type="button" class="secondary" id="lpStockConfirmedRefresh">↻ Actualiser le stock</button><p class="muted" id="lpStockConfirmedStatus" role="status">Stock local disponible.</p>';table.before(box);
         }
         function boot(){
          if(typeof productForm!=='function'||typeof stock!=='function')return;
          const baseForm=productForm;productForm=function(id){open(id);const result=baseForm.apply(this,arguments);const button=get('saveProduct');if(button)button.onclick=()=>saveProduct(button);return result;};window.productForm=productForm;
          const baseStock=stock;stock=function(){const r=baseStock.apply(this,arguments);mount();if(!get('pname'))read(false);return r;};window.stock=stock;
          window.lpV41StockClick=click;window.lpV41SaveProduct=saveProduct;
          mount();
         }
         if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
         window.lpStockConfirmedV79={read,saveProduct,duplicate,installRows,boot,open};
        })();

        LPSTOCK
        cat > tests/stock-confirmed-v79/test.cjs <<'LPTEST'
        const fs=require('fs'),vm=require('vm'),assert=require('assert');
        const source=fs.readFileSync(__dirname+'/stock-confirmed.js','utf8');
        function setup(){
         const nodes={},messages=[],calls=[],server=new Map();let failWrite=false,lostResponse=false;
         const make=(id,value='')=>nodes[id]={id,value,textContent:'Enregistrer',disabled:false,replaceChildren(){delete nodes.pname;},before(){}};
         ['pname','plot','pbarcode','pprice','pwholesale','pcost','pstock','pmin','pexp','saveProduct','stockForm','stockSearch'].forEach(id=>make(id));
         Object.assign(nodes.pname,{value:'Produit neuf'});for(const id of ['pprice','pwholesale','pcost','pstock','pmin'])nodes[id].value='10';nodes.plot.value='lot1';nodes.pexp.value='2028-01-01';
         const ctx={console,structuredClone,AbortController,setTimeout,clearTimeout,Date,Map,Set,Number,JSON,Error,navigator:{onLine:true},localStorage:{setItem(k,v){this[k]=v;}},document:{readyState:'loading',getElementById:id=>nodes[id]||null,addEventListener(){},createElement(){return {innerHTML:''};}},window:{addEventListener(){}},SUPABASE:{url:'https://example.invalid',key:'public'},currentUser:{id:'dg',role:'DG'},currentAgency:'kamina',page:'stock',db:{_lpDataGeneration:1,products:[{id:1,name:'Centre',agency:'centre',stock:7}],sales:[{id:'invoice',total:55000}]},uid:()=>12345,toast:x=>messages.push(x),drawStock(){},stock(){},productForm(){}};
         ctx.window.lpGetSessionTokenV16=async()=> 'test-token';
         ctx.window.fetch=async(url,init)=>{
          const name=url.split('/').pop(),body=JSON.parse(init.body);calls.push({name,body,headers:init.headers});
          let data;if(name==='lp_data_generation_v39')data=3;
          else if(name==='lp_read_state_v32')data=[{contenu:{products:[...server.values()]}}];
          else if(name==='lp_save_product_dg_v41'){
           if(failWrite)throw Error('Network failed');
           const p=body.p_product,old=server.get(String(p.id));
           if(old&&body.p_change_stock&&old.stock!==body.p_expected_stock)return {ok:false,json:async()=>({message:'STOCK_CHANGED_REFRESH'})};
           data={...p,stock:old&&!body.p_change_stock?old.stock:p.stock};server.set(String(p.id),data);
           if(lostResponse){lostResponse=false;throw Error('Response lost');}
          }else throw Error(name);
          return {ok:true,json:async()=>structuredClone(data)};
         };
         vm.createContext(ctx);vm.runInContext(source,ctx);const api=ctx.window.lpStockConfirmedV79;
         return {ctx,nodes,messages,calls,server,api,setFail:v=>failWrite=v,setLost:v=>lostResponse=v};
        }
        (async()=>{
         let x=setup();x.api.open();assert(await x.api.saveProduct(x.nodes.saveProduct));
         assert.equal(x.server.size,1);assert.equal(x.ctx.db._lpDataGeneration,1);assert.equal(x.ctx.db.sales[0].total,55000);assert.equal(x.ctx.db.products[0].stock,7);
         assert(x.calls.filter(c=>c.name==='lp_save_product_dg_v41').every(c=>c.headers['x-lp-data-generation']==='3'));
         x=setup();x.server.set('9',{id:9,agency:'kamina',name:'Produit neuf',lot:'lot1',expiry:'2028-01-01',stock:5});x.api.open();assert(!await x.api.saveProduct(x.nodes.saveProduct));assert.equal(x.calls.filter(c=>c.name==='lp_save_product_dg_v41').length,0);
         x=setup();x.api.open();x.setLost(true);assert(!await x.api.saveProduct(x.nodes.saveProduct));assert(x.nodes.pname);assert(await x.api.saveProduct(x.nodes.saveProduct));assert.equal(x.server.size,1);assert.equal(x.calls.filter(c=>c.name==='lp_save_product_dg_v41').length,1);
         x=setup();x.api.open();x.setFail(true);assert(!await x.api.saveProduct(x.nodes.saveProduct));assert(x.nodes.pname);x.setFail(false);assert(await x.api.saveProduct(x.nodes.saveProduct));assert.equal(x.server.size,1);
         x=setup();x.ctx.db.products.push({id:8,agency:'kamina',name:'Avant',stock:10});x.server.set('8',{id:8,agency:'kamina',name:'Avant',stock:9});x.api.open(8);x.nodes.pstock.value='11';assert(!await x.api.saveProduct(x.nodes.saveProduct));assert.equal(x.server.get('8').stock,9);assert(x.nodes.pname);
         x=setup();x.ctx.navigator.onLine=false;x.api.open();assert(!await x.api.saveProduct(x.nodes.saveProduct));assert.equal(x.calls.length,0);assert(x.nodes.pname);
         x=setup();x.ctx.currentUser.role='Vendeur';x.api.open();assert(!await x.api.saveProduct(x.nodes.saveProduct));assert.equal(x.calls.length,0);
         x=setup();x.server.set('8',{id:8,agency:'kamina',name:'Serveur',stock:3});assert(await x.api.read(true));assert(x.ctx.db.products.some(p=>p.name==='Centre'));assert.equal(x.ctx.db.products.find(p=>p.id===8).stock,3);assert.equal(x.ctx.db._lpDataGeneration,1);
         x=setup();x.api.boot();x.ctx.productForm();x.setLost(true);await x.nodes.saveProduct.onclick();await x.nodes.saveProduct.onclick();assert.equal(x.server.size,1);
         console.log('PASS: confirmation, offline, retries with stable ID, duplicate prevention, concurrent sales, agency/account isolation, no generation restamp, no financial changes, legacy onclick.');
        })().catch(e=>{console.error(e);process.exitCode=1;});

        LPTEST
        node --check tests/stock-confirmed-v79/stock-confirmed.js
        node tests/stock-confirmed-v79/test.cjs
    - name: Corriger la couche Web Windows et ses empreintes
      shell: python
      run: |
        from pathlib import Path
        import json,hashlib,shutil,re
        m=json.loads(Path('platform-manifest.json').read_text())
        assert m['version']=='29.6.0.79','Correctif reserve a V79'
        assert m['files']['app.js']=='63f7f1269aa45c47569aed326499cc92577f94895ec42331f4b3ede8c3e2cf60','Moteur different: arret'
        for f,h in m['files'].items():assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h,'Fichier incoherent: '+f
        fix=Path('tests/stock-confirmed-v79/stock-confirmed.js').read_text()
        p=Path('platform-update.js');text=p.read_text()
        if 'LP_WEB_WINDOWS_STOCK_CONFIRMED_V79_1' not in text:
         assert m['build']==2026400079,'Build inattendu: arret'
         p.write_text(text+'\n'+fix)
         m['build']=2026400080;m['platform_fix']='stock-confirmed-v79-1'
         m['files']={f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in m['files']}
         Path('platform-manifest.json').write_text(json.dumps(m,indent=2)+'\n')
         sw=Path('service-worker.js');text=sw.read_text();text,count=re.subn(r"const CACHE_NAME='leader-pharma-web-[^']+';","const CACHE_NAME='leader-pharma-web-2026400080';",text,count=1);assert count==1;sw.write_text(text)
         a=Path('platform')/str(m['build']);assert not a.exists(),'Archive immuable deja existante'
         a.mkdir(parents=True)
         for f in m['files']:
          (a/f).parent.mkdir(parents=True,exist_ok=True);shutil.copy2(f,a/f)
         shutil.copy2('platform-manifest.json',a/'platform-manifest.json')
        else:assert m['build']==2026400080 and m.get('platform_fix')=='stock-confirmed-v79-1','Correctif incoherent'
        for f,h in m['files'].items():
         assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h
         assert (Path('platform')/str(m['build'])/f).read_bytes()==Path(f).read_bytes()
        print('Archive et empreintes verifiees. Aucun appel aux donnees metier.')
    - name: Verifier JavaScript
      run: |-
        node --check platform-update.js
        node --check service-worker.js
    - name: Publier sans modifier les donnees
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add platform-update.js platform-manifest.json service-worker.js platform/2026400080 tests/stock-confirmed-v79
        if ! git diff --cached --quiet; then
         git commit -m "Fix V79 Web Windows stock confirmation and safe retries"
         git push origin HEAD:main
        fi
    - name: Demander la publication Pages
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /tmp/lp-stock-pages.json
    - name: Verifier Web et le moteur Windows
      shell: python
      run: |
        import json,urllib.request,hashlib,time
        expected=json.load(open('platform-manifest.json'));base='https://frilunga-gif.github.io/leader-pharma-web/'
        for attempt in range(36):
         try:
          suffix='?stock-fix='+str(int(time.time()))
          def fetch(f):
           req=urllib.request.Request(base+f+suffix,headers={'Cache-Control':'no-cache'})
           with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          live=json.loads(fetch('platform-manifest.json'));assert live==expected
          for f,h in expected['files'].items():
           assert hashlib.sha256(fetch(f)).hexdigest()==h
           assert hashlib.sha256(fetch('platform/'+str(expected['build'])+'/'+f)).hexdigest()==h
          print('WEB ET WINDOWS: correctif stock publie, fichiers et archive verifies.');break
         except Exception as e:print('Publication en cours:',type(e).__name__)
         time.sleep(5)
        else:raise SystemExit('Publication non confirmee: relancer ce workflow sans reinitialiser.')
    - name: Instructions
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'END'
        Correctif stock V79 publie pour Web et Windows. Web: accepter la mise a jour puis reouvrir le stock. Windows: menu Verifier les mises a jour, accepter puis fermer et rouvrir. Version affichee V79; correctif interne 2026400080. Aucun nouvel installateur EXE. Donnees locales conservees. Les anciennes copies globales restent bloquees; les produits passent par leur enregistrement serveur dedie.
        END
