name: Leader Pharma F29.6.0.17 WEB DG QUOTA 402 OFFLINE SECURE FIX2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corriger:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajouter secours DG quota 402
        shell: bash
        run: |
          set -euo pipefail
          MARKER="LEADER PHARMA F29.6.0.17 DG QUOTA 402 OFFLINE SECURE ACTIF"

          grep -Fq "LEADER PHARMA F29.6.0.17 SUPABASE EGRESS MAITRISE ACTIF" app.js
          grep -Fq "LEADER PHARMA F29.6.0.17 RESET DONNEES DG SEUL ACTIF" app.js

          if ! grep -Fq "$MARKER" app.js; then
            printf '%s' '' | base64 --decode >> app.js
          fi

          grep -Fq "$MARKER" app.js
          node --check app.js

      - name: Commit et push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js; then
            echo "Correctif deja present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: DG secure offline fallback on Supabase 402 quota"
          git push
