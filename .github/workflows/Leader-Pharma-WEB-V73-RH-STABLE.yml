name: Leader Pharma WEB V73 RH STABLE
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Recuperer et verifier la base 72
      shell: python
      run: "from pathlib import Path\nimport urllib.request,json,hashlib,shutil\n\
        base='https://frilunga-gif.github.io/leader-pharma-web/'\nm=json.loads(urllib.request.urlopen(base+'platform-manifest.json',timeout=30).read())\n\
        assert m['build']==2026100802, 'La base publiee a change: reexaminer avant\
        \ correction'\nr=Path('site');r.mkdir(exist_ok=True)\nfor source in Path('.').iterdir():\n\
        \ if source.name in ['.git','.github','site']:continue\n if source.is_dir():shutil.copytree(source,r/source.name,dirs_exist_ok=True)\n\
        \ elif source.is_file():shutil.copy2(source,r/source.name)\nfor n,h in m['files'].items():\n\
        \ data=urllib.request.urlopen(base+'platform/'+str(m['build'])+'/'+n,timeout=60).read()\n\
        \ assert hashlib.sha256(data).hexdigest()==h,n\n p=r/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)\n"
    - name: Corriger uniquement RH
      shell: python
      run: "from pathlib import Path\np=Path('site/app.js')\ns=p.read_text()\nstart=s.index('/*\
        \ LEADER PHARMA V50 FIX6 RH ACTUALISATION UNIQUE STABLE */')\nend=s.index('/*\
        \ LEADER PHARMA V71 SUPPRESSION',start)\nb=s[start:end]\ndef change(a,c):\n\
        \ global b\n assert b.count(a)==1,a\n b=b.replace(a,c)\nchange(\"let flight=null,last='',identity='',saving=false,timer;\"\
        ,\"let flight=null,last='',identity='',saving=false,timer,lastRunAt=0;\")\n\
        change(\"if(flight)return flight;if(!currentUser)return false;\",\"if(flight)return\
        \ flight;if(!currentUser)return false;\\n if(!manual&&actor()===identity&&Date.now()-lastRunAt<45000&&signature()===last)return\
        \ true;\\n identity=actor();\")\nchange(\"mount();state('Échange avec le serveur…');\"\
        ,\"mount();if(manual)state('Échange avec le serveur…');\")\nchange(\"if(a){if(dg()){await\
        \ a.pull();}\",\"if(a){if(dg()){await (manual?a.pull():a.pullAuto());}\")\n\
        change(\"merge(remote);last=signature();if(page==='payroll'&&dg()&&typeof\
        \ window.lpV14MountRH==='function')window.lpV14MountRH();state('Justifications\
        \ RH : réception serveur confirmée.');\",\"const before=signature();merge(remote);last=signature();lastRunAt=Date.now();if(before!==last&&page==='payroll'&&dg()&&typeof\
        \ window.lpV14MountRH==='function'&&!(window.lpV28IsEditing&&window.lpV28IsEditing()))window.lpV14MountRH();state('Justifications\
        \ RH : réception serveur confirmée.');\")\ns=s[:start]+b+s[end:]\n# Attendance\
        \ timestamp changes alone do not replace all photo DOM nodes.\na=\"r.lpAttendanceServerUpdatedAt||r._lpAttendanceUpdatedAt||r.updatedAt||r.updated_at||''\"\
        \nvstart=s.index('/* LEADER PHARMA V25 RH ACTUALISATION UNIQUE SANS RECONSTRUCTION\
        \ */')\nvend=s.index('})();',vstart)+5\nv=s[vstart:vend]\nassert v.count(a)==1\n\
        v=v.replace(a,\"r.entryPhoto||'',r.exitPhoto||''\")\ns=s[:vstart]+v+s[vend:]\n\
        p.write_text(s)\nprint('RH patch applied')\n"
    - name: Verifier JavaScript
      run: 'node --check site/app.js

        node --check site/dg-security.js

        node --check site/platform-update.js'
    - name: Creer manifeste controle
      shell: python
      run: "from pathlib import Path\nimport json,hashlib,shutil\nr=Path('site');names=['index.html','app.js','dg-security.js','platform-update.js','styles.css','assets/leader-pharma-logo.png']\n\
        m={'schema':1,'build':2026101401,'version':'29.6.0.73','base':'Android 72\
        \ - RH stable','files':{n:hashlib.sha256((r/n).read_bytes()).hexdigest() for\
        \ n in names}}\nfor n in names:\n p=r/'platform'/str(m['build'])/n;p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(r/n,p)\n\
        (r/'platform-manifest.json').write_text(json.dumps(m))\n(r/'platform'/str(m['build'])/'platform-manifest.json').write_text(json.dumps(m))\n"
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - id: deploy
      uses: actions/deploy-pages@v4
