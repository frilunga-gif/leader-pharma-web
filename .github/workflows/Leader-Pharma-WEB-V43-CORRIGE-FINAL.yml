    - shell: python
      run: with open('.lp-web-payload','a') as f:f.write('')
    - shell: python
      run: with open('.lp-web-payload','a') as f:f.write('')
    - shell: python
      run: with open('.lp-web-payload','a') as f:f.write('')
    - shell: python
      run: with open('.lp-web-payload','a') as f:f.write('')
    - shell: python
      run: with open('.lp-web-payload','a') as f:f.write('')
    - shell: python
      run: with open('.lp-web-payload','a') as f:f.write('')
    - shell: python
      run: with open('.lp-web-payload','a') as f:f.write('')
    - shell: python
      run: with open('.lp-web-payload','a') as f:f.write('')
    - shell: python
      run: with open('.lp-web-payload','a') as f:f.write('')
    - name: Decompresser fichiers
      run: node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('.lp-web-payload.zip',z.brotliDecompressSync(Buffer.from(fs.readFileSync('.lp-web-payload','utf8'),'base64')));"
    - name: Installer Web V42 verifie
      shell: python
      run: "import base64,io,zipfile,json,hashlib,pathlib,shutil\nz=zipfile.ZipFile('.lp-web-payload.zip')\nz.extractall('release-web')\n\
        r=pathlib.Path('release-web');m=json.loads((r/'platform-manifest.json').read_text())\n(r/'assets').mkdir(exist_ok=True)\n\
        logo=pathlib.Path('leader-pharma-logo.png')\nif not logo.exists():logo=pathlib.Path('assets/leader-pharma-logo.png')\n\
        shutil.copy2(logo,r/'assets/leader-pharma-logo.png')\nfor n,h in m['files'].items():\n assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n\n\
        for p in r.iterdir():\n if p.is_file():shutil.copy2(p,p.name)\nshutil.copytree(r/'assets','assets',dirs_exist_ok=True)\n\
        shutil.copytree(r,pathlib.Path('platform')/str(m['build']),dirs_exist_ok=True)\nshutil.rmtree(r)\n"
    - name: Verifier JavaScript
      run: 'node --check app.js

        node --check dg-security.js

        node --check platform-update.js

        node --check service-worker.js'
    - name: Publier fichiers sur main
      run: 'git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add index.html app.js dg-security.js platform-update.js service-worker.js styles.css assets platform platform-manifest.json

        if ! git diff --cached --quiet; then git commit -m ''Web V43 base V42 et mises a jour''; git push origin main; fi'
    - uses: actions/upload-artifact@v4
      with:
        name: Leader-Pharma-Web-V43
        path: 'index.html

          app.js

          dg-security.js

          platform-update.js

          service-worker.js

          styles.css

          assets

          platform

          platform-manifest.json'
    - name: Preparer publication Pages
      shell: python
      run: "from pathlib import Path\nimport shutil\nr=Path('_site');r.mkdir(exist_ok=True)\nfor n in ['index.html','app.js','dg-security.js','platform-update.js','service-worker.js','styles.css','platform-manifest.json']:\n\
        \ shutil.copy2(n,r/n)\nfor n in ['assets','platform']:\n shutil.copytree(n,r/n,dirs_exist_ok=True)\n(r/'.nojekyll').touch()"
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - name: Publier Web maintenant
      id: deployment
      uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
