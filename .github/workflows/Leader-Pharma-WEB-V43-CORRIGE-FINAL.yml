name: Leader Pharma WEB V43 CORRIGE FINAL
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: leader-pharma-web-publication
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
