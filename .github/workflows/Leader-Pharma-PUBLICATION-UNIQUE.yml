name: Leader Pharma PUBLICATION UNIQUE Android Web Windows

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: leader-pharma-publication-unique
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      VERSION: 29.6.0.75
      BUILD: '2026101404'
      CODE: '2026300975'
      FINAL_APK: LeaderPharmaManagerPro-ANDROID-V53-MOTEUR-COMMUN.apk
      FINAL_TAG: leader-pharma-commun-75
      BASE_URL: https://frilunga-gif.github.io/leader-pharma-web/
      SUPABASE_URL: https://dinainghufmsykambkyv.supabase.co
      BUCKET: leader-pharma-updates-private
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verifier les secrets et le depot central
        env:
          KEY: ${{ secrets.LEADER_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.LEADER_KEYSTORE_PASSWORD }}
          SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = frilunga-gif/leader-pharma-web
          test -n "$KEY" && test -n "$PASSWORD" && test -n "$SERVICE"
      - name: Reprendre le moteur commun V74 une seule fois
        shell: python
        run: |
          from pathlib import Path
          import urllib.request, json, hashlib, os
          files=['index.html','app.js','dg-security.js','platform-update.js','styles.css','assets/leader-pharma-logo.png']
          root=Path('engine')
          if not root.exists():
              base=os.environ['BASE_URL']
              m=json.loads(urllib.request.urlopen(base+'platform-manifest.json',timeout=60).read())
              assert m['build']==2026101403 and m['version']=='29.6.0.74', 'Base V74 attendue'
              assert set(m['files'])==set(files)
              assert m['files']['app.js']=='7bfd311eed9eac168591bba4e4a87ccbff5015d520901f7656299060a1718a1d'
              for name in files:
                  data=urllib.request.urlopen(base+'platform/'+str(m['build'])+'/'+name,timeout=120).read()
                  assert hashlib.sha256(data).hexdigest()==m['files'][name], name
                  p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          for name in files:
              assert (root/name).is_file(), name
          s=(root/'app.js').read_text()
          assert 'lpPhotoContinuityV74' in s
          assert 'V72 PHOTOS POINTAGE SUPPRESSION DG' in s
          assert 'V50 FIX6 RH ACTUALISATION' in s
          assert 'LEADER PHARMA SESSION SUPABASE COMMUNE V16 ACTIF' in s
          assert hashlib.sha256((root/'dg-security.js').read_bytes()).hexdigest()=='0e83b7043fd35d6445a4b874741a8b3b17b14e27f2ed67fec78ebf893faf30e7'
      - name: Recuperer l enveloppe Android validee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view leader-pharma-android-envelope-v52 >/dev/null 2>&1; then
            gh release download leader-pharma-android-envelope-v52 --pattern base.apk --dir .
          else
            python3 - <<'PY'
          import urllib.request,json,os
          req=urllib.request.Request(os.environ['SUPABASE_URL']+'/functions/v1/leader-pharma-master-update',headers={'x-leader-update':'LP-MASTER-PRO-2026','x-leader-current-version':'29.6.0.28'})
          m=json.loads(urllib.request.urlopen(req,timeout=60).read())
          assert m.get('ok') is True and m.get('technical_version')=='29.6.0.72', 'La premiere installation exige le MASTER Android V52/72'
          assert m['download_url'].startswith(os.environ['SUPABASE_URL']+'/storage/v1/')
          data=urllib.request.urlopen(m['download_url'],timeout=120).read()
          open('base.apk','wb').write(data)
          PY
          fi
          python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile('base.apk') as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('assets/public/app.js')).hexdigest()=='f7dca4a16e4fcd3d4509378b79414c5289ee1816b54cd53cc211f8f336703219'
              assert hashlib.sha256(z.read('assets/public/dg-security.js')).hexdigest()=='0e83b7043fd35d6445a4b874741a8b3b17b14e27f2ed67fec78ebf893faf30e7'
          PY
      - name: Installer et verifier les outils Android
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          curl --fail --location --silent --show-error https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar --output /tmp/apktool.jar
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs base.apk > /tmp/base-cert.txt
          grep -Fiq '0369e21ba4b01689b177b3d0a4bcce2ba10c858790e4db0cb19eaebb5f69f0f2' /tmp/base-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging base.apk > /tmp/base-badging.txt
          java -jar /tmp/apktool.jar d -f base.apk -o decoded
      - name: Integrer une seule source dans Android et Web
        shell: python
        run: |
          from pathlib import Path
          import os,re,shutil,json,hashlib
          version=os.environ['VERSION'];build=int(os.environ['BUILD'])
          prior_version=json.loads(Path('platform-manifest.json').read_text()).get('version','29.6.0.74')
          version_pattern=r'29\.6\.0\.(?:72|73|74|75)|'+re.escape(prior_version)
          source=Path('engine');stage=Path('_site');stage.mkdir()
          s=(source/'app.js').read_text()
          s=re.sub(version_pattern,version,s)
          (source/'app.js').write_text(s)
          (Path('decoded/assets/public')/'app.js').write_bytes((source/'app.js').read_bytes())
          index=Path('decoded/assets/public/index.html')
          index.write_text(re.sub(version_pattern,version,index.read_text()))
          p=Path('decoded/apktool.yml');y=p.read_text()
          y,n=re.subn(r'(?m)^  versionCode:.*$',"  versionCode: '"+os.environ['CODE']+"'",y);assert n==1
          y,n=re.subn(r'(?m)^  versionName:.*$',"  versionName: '"+version+"'",y);assert n==1
          p.write_text(y)
          files=['index.html','app.js','dg-security.js','platform-update.js','styles.css','assets/leader-pharma-logo.png']
          html=(source/'index.html').read_text()
          (source/'index.html').write_text(re.sub(version_pattern,version,html))
          for name in files:
              dest=stage/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source/name,dest)
          m={'schema':1,'build':build,'version':version,'base':'Moteur commun Android Web Windows','files':{name:hashlib.sha256((stage/name).read_bytes()).hexdigest() for name in files}}
          assert hashlib.sha256(Path('decoded/assets/public/app.js').read_bytes()).hexdigest()==m['files']['app.js']
          (stage/'platform-manifest.json').write_text(json.dumps(m,indent=2))
          old=Path('platform')
          if old.exists():shutil.copytree(old,stage/'platform')
          archive=stage/'platform'/str(build)
          if archive.exists():
              prior=json.loads((archive/'platform-manifest.json').read_text())
              assert prior==m, 'Numero BUILD deja utilise pour un autre contenu'
          else:
              archive.mkdir(parents=True)
              for name in files:
                  dest=archive/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(stage/name,dest)
              shutil.copy2(stage/'platform-manifest.json',archive/'platform-manifest.json')
          worker="""const CACHE_NAME='leader-pharma-web-BUILD';
          const FILES=['./index.html','./app.js','./dg-security.js','./platform-update.js','./styles.css','./assets/leader-pharma-logo.png'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(FILES))));
          self.addEventListener('message',e=>{if(e.data?.type==='ACTIVATE')self.skipWaiting();});
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('leader-pharma-web-')&&k!==CACHE_NAME).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{
            const u=new URL(e.request.url),base=new URL('./',self.location.href);
            if(e.request.method!=='GET'||u.origin!==base.origin)return;
            const rel=u.pathname.slice(base.pathname.length);
            if(e.request.mode==='navigate'){e.respondWith(caches.open(CACHE_NAME).then(c=>c.match('./index.html')).then(r=>r||fetch(e.request)));return;}
            if(FILES.includes('./'+rel))e.respondWith(caches.open(CACHE_NAME).then(c=>c.match('./'+rel)).then(r=>r||fetch(e.request)));
          });
          """
          (stage/'service-worker.js').write_text(worker.replace('BUILD',str(build)))
          (stage/'.nojekyll').touch()
      - name: Verifier JavaScript et construire APK
        run: |
          set -euo pipefail
          for f in app.js dg-security.js platform-update.js service-worker.js; do node --check "_site/$f"; done
          java -jar /tmp/apktool.jar b decoded -o unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 unsigned.apk aligned.apk
      - name: Signer avec la cle Android permanente
        env:
          LEADER_KEYSTORE_BASE64: ${{ secrets.LEADER_KEYSTORE_BASE64 }}
          LEADER_KEYSTORE_PASSWORD: ${{ secrets.LEADER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f leader.keystore' EXIT
          printf '%s' "$LEADER_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > leader.keystore
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" sign --ks leader.keystore --ks-key-alias leaderpharma --ks-pass env:LEADER_KEYSTORE_PASSWORD --key-pass env:LEADER_KEYSTORE_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL_APK" aligned.apk
          "$SIGNER" verify --verbose --print-certs "$FINAL_APK" > /tmp/final-cert.txt
          grep -Fiq '0369e21ba4b01689b177b3d0a4bcce2ba10c858790e4db0cb19eaebb5f69f0f2' /tmp/final-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$FINAL_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL_APK" > /tmp/final-badging.txt
          python3 - <<'PY'
          import zipfile,hashlib,re,os
          from pathlib import Path
          a=re.search(r"package: name='([^']+)'",Path('/tmp/base-badging.txt').read_text()).group(1)
          b=Path('/tmp/final-badging.txt').read_text()
          assert "package: name='"+a+"'" in b
          assert "versionName='"+os.environ['VERSION']+"'" in b
          assert "versionCode='"+os.environ['CODE']+"'" in b
          with zipfile.ZipFile(os.environ['FINAL_APK']) as z:
              assert z.testzip() is None
              assert z.read('assets/public/app.js')==Path('_site/app.js').read_bytes()
          PY
      - name: Conserver la base et publier les sources communes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view leader-pharma-android-envelope-v52 >/dev/null 2>&1; then
            gh release create leader-pharma-android-envelope-v52 base.apk --title 'Enveloppe Android V52 permanente' --notes 'Base native validee, conservee pour la publication commune.'
          fi
          cp -R _site/platform .
          cp _site/platform-manifest.json .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine platform platform-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Moteur commun $VERSION"
            git push origin HEAD:main
          fi
          gh release view "$FINAL_TAG" >/dev/null 2>&1 || gh release create "$FINAL_TAG" --title "Leader Pharma moteur commun $VERSION" --notes 'Android signe, Web et Windows issus du meme moteur RH. Aucune nouvelle remise a zero.'
          gh release upload "$FINAL_TAG" "$FINAL_APK" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Leader-Pharma-moteur-commun-75
          path: |
            LeaderPharmaManagerPro-ANDROID-V53-MOTEUR-COMMUN.apk
            engine
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier Web et moteur Windows
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Publier APK dans MASTER PRO
        env:
          SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          AUTH=(--header "Authorization: Bearer $SERVICE" --header "apikey: $SERVICE")
          MASTER_PATH="stable/$FINAL_APK"
          curl --fail --silent --show-error --request POST "$SUPABASE_URL/storage/v1/object/$BUCKET/$MASTER_PATH" "${AUTH[@]}" --header 'Content-Type: application/vnd.android.package-archive' --header 'x-upsert: true' --data-binary "@$FINAL_APK" > /tmp/storage.json
          SHA="$(sha256sum "$FINAL_APK" | cut -d ' ' -f1)"
          SIZE="$(stat -c '%s' "$FINAL_APK")"
          NOTES='Moteur commun 75 : photos RH V74 harmonisees. Meme app.js Android Web Windows. Fonctions natives Android conservees.'
          BODY="$(jq -n --arg v "$VERSION" --argjson c "$CODE" --arg b "$BUCKET" --arg p "$MASTER_PATH" --arg s "$SHA" --argjson z "$SIZE" --arg n "$NOTES" '{channel:"stable",version_name:$v,version_code:$c,storage_bucket:$b,storage_path:$p,sha256:$s,file_size_bytes:$z,is_active:true,is_mandatory:false,release_notes:$n,published_at:(now|todateiso8601)}')"
          curl --fail --silent --show-error --request PATCH "$SUPABASE_URL/rest/v1/lp_update_releases?channel=eq.stable&version_code=eq.$CODE" "${AUTH[@]}" --header 'Content-Type: application/json' --header 'Prefer: return=representation' --data "$BODY" > /tmp/release.json
          if [ "$(jq 'length' /tmp/release.json)" -eq 0 ]; then
            curl --fail --silent --show-error --request POST "$SUPABASE_URL/rest/v1/lp_update_releases" "${AUTH[@]}" --header 'Content-Type: application/json' --header 'Prefer: return=representation' --data "$BODY" > /tmp/release.json
          fi
          jq -e --argjson c "$CODE" 'length==1 and .[0].version_code==$c and .[0].is_active==true' /tmp/release.json >/dev/null
          curl --fail --silent --show-error --request PATCH "$SUPABASE_URL/rest/v1/lp_update_releases?channel=eq.stable&version_code=lt.$CODE&is_active=eq.true" "${AUTH[@]}" --header 'Content-Type: application/json' --data '{"is_active":false}' > /tmp/old.json
          BODY="$(jq -n --arg v "F$VERSION MASTER PRO" --arg n "$NOTES" '{current_version:$v,minimum_version:"29.6.0.28",title:"MASTER PRO moteur commun",notes:$n,force_update:false,updated_at:(now|todateiso8601)}')"
          curl --fail --silent --show-error --request PATCH "$SUPABASE_URL/rest/v1/lp_master_release?channel=eq.stable" "${AUTH[@]}" --header 'Content-Type: application/json' --header 'Prefer: return=representation' --data "$BODY" > /tmp/master.json
          jq -e 'length==1' /tmp/master.json >/dev/null
          curl --fail --silent --show-error "$SUPABASE_URL/functions/v1/leader-pharma-master-update" --header 'x-leader-update: LP-MASTER-PRO-2026' --header 'x-leader-current-version: 29.6.0.28' > /tmp/check.json
          jq -e --arg v "$VERSION" --arg d "F$VERSION MASTER PRO" '.ok==true and .update_available==true and .technical_version==$v and .display_version==$d' /tmp/check.json >/dev/null
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
