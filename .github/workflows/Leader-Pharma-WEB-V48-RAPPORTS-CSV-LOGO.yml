    - name: Decompresser fichiers
      run: 'python3 - <<''B85''

        import base64

        from pathlib import Path

        Path(''.lp-web-compressed'').write_bytes(base64.b85decode(Path(''.lp-web-payload'').read_text()))

        B85

        node -e "const fs=require(''fs''),z=require(''zlib'');fs.writeFileSync(''.lp-web-payload.zip'',z.brotliDecompressSync(fs.readFileSync(''.lp-web-compressed'')));"'
    - name: Installer Web V48 rapports CSV et verifier empreintes
      shell: python
      run: "import base64,io,zipfile,json,hashlib,pathlib,shutil\nz=zipfile.ZipFile('.lp-web-payload.zip')\nz.extractall('release-web')\n\
        r=pathlib.Path('release-web');m=json.loads((r/'platform-manifest.json').read_text())\n(r/'assets').mkdir(exist_ok=True)\n\
        for n,h in m['files'].items():\n assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n\nfor p in r.iterdir():\n\
        \ if p.is_file():shutil.copy2(p,p.name)\nshutil.copytree(r/'assets','assets',dirs_exist_ok=True)\nshutil.copytree(r,pathlib.Path('platform')/str(m['build']),dirs_exist_ok=True)\n\
        shutil.rmtree(r)\n"
    - name: Creer icones Web installables
      run: 'python3 -m pip install --quiet Pillow

        python3 - <<''ICONS''

        from PIL import Image

        from pathlib import Path

        import json

        root=Path(''assets'');im=Image.open(root/''leader-pharma-logo.png'')

        for n in [192,512]:im.resize((n,n),Image.Resampling.LANCZOS).save(root/(''leader-pharma-icon-''+str(n)+''.png''))

        build=json.loads(Path(''platform-manifest.json'').read_text())[''build'']

        import shutil

        for n in [192,512]:shutil.copy2(root/(''leader-pharma-icon-''+str(n)+''.png''),Path(''platform'')/str(build)/''assets''/(''leader-pharma-icon-''+str(n)+''.png''))

        ICONS'
    - name: Verifier JavaScript
      run: 'node --check app.js

        node --check dg-security.js

        node --check platform-update.js

        node --check service-worker.js'
    - name: Publier fichiers sur main
      run: 'git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add index.html app.js dg-security.js platform-update.js service-worker.js styles.css assets platform platform-manifest.json

        if ! git diff --cached --quiet; then git commit -m ''Web V48 rapport CSV par agence et logo''; git push origin main;
        fi'
    - uses: actions/upload-artifact@v4
      with:
        name: Leader-Pharma-Web-V45
        path: 'index.html

          app.js

          dg-security.js

          platform-update.js

          service-worker.js

          styles.css

          assets

          platform

          platform-manifest.json'
    - name: Preparer publication Pages
      shell: python
      run: "from pathlib import Path\nimport shutil\nr=Path('_site');r.mkdir(exist_ok=True)\nfor n in ['index.html','app.js','dg-security.js','platform-update.js','service-worker.js','styles.css','platform-manifest.json']:\n\
        \ shutil.copy2(n,r/n)\nfor n in ['assets','platform']:\n shutil.copytree(n,r/n,dirs_exist_ok=True)\n(r/'.nojekyll').touch()"
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - name: Publier Web maintenant
      id: deployment
      uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
