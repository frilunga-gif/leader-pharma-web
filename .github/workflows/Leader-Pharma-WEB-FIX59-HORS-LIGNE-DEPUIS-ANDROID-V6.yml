name: Leader Pharma WEB FIX59 HORS LIGNE DEPUIS ANDROID V6

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publier_web:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer depot Web
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recuperer APK Android V6 validee 10 sur 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="leader-pharma-f29-6-0-17-android-fix59-offline-local-final-v6"
          APK="LeaderPharmaManagerPro-F29-6-0-17-ANDROID-FIX59-OFFLINE-LOCAL-FINAL-V6.apk"
          REPO="frilunga-gif/leader-pharma-manager-android"

          gh release download "$TAG" --repo "$REPO" --pattern "$APK" --dir .
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          mkdir -p web-v6
          cd web-v6
          unzip -q "../$APK" 'assets/public/*'
          cd ..

          test -s web-v6/assets/public/index.html
          test -s web-v6/assets/public/app.js
          test -s web-v6/assets/public/dg-security.js
          test -s web-v6/assets/public/styles.css
          test -s web-v6/assets/public/assets/leader-pharma-logo.png

      - name: Verifier systeme hors ligne photos et minuit
        run: |
          set -euo pipefail
          APP="web-v6/assets/public/app.js"
          INDEX="web-v6/assets/public/index.html"

          node --check "$APP"
          node --check web-v6/assets/public/dg-security.js

          grep -Fq "LEADER PHARMA F29.6.0.17 DG LOGIN LOCAL HORS LIGNE FINAL V6 ACTIF" "$APP"
          grep -Fq "LEADER PHARMA F29.6.0.17 RETOUR DG SERVEUR FIX59 ACTIF" "$APP"
          grep -Fq "LEADER PHARMA F29.6.0.17 RESET DONNEES DG SEUL ACTIF" "$APP"
          grep -Fq "LEADER PHARMA F29.4.5 POINTAGE DG SYNC COMPLET CIBLE FINAL ACTIF" "$APP"
          grep -Fq "RH POINTAGE ACTUALISER PHOTOS DISTANTES FIX60 ACTIF" "$APP"
          grep -Fq "entryPhoto" "$APP"
          grep -Fq "exitPhoto" "$APP"
          grep -Fq "row.exitDate" "$APP"
          grep -Eq "POINTAGE 24H( NUIT)? ACTIF" "$APP"
          grep -Fq "Actualiser les pointages et les photos" "$INDEX"
          grep -Fq "V6: interception touch DG retiree" "$INDEX"
          grep -Fq "V6: interception click DG retiree" "$INDEX"

      - name: Installer Web V6 dans le depot
        run: |
          set -euo pipefail
          cp web-v6/assets/public/index.html index.html
          cp web-v6/assets/public/app.js app.js
          cp web-v6/assets/public/dg-security.js dg-security.js
          cp web-v6/assets/public/styles.css styles.css
          mkdir -p assets
          cp web-v6/assets/public/assets/leader-pharma-logo.png assets/leader-pharma-logo.png

          node --check app.js
          node --check dg-security.js
          grep -Fq "DG LOGIN LOCAL HORS LIGNE FINAL V6 ACTIF" app.js

      - name: Publier Web FIX59 hors ligne
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js dg-security.js styles.css assets/leader-pharma-logo.png

          if git diff --cached --quiet; then
            echo "Web V6 deja installe. Aucun changement."
          else
            git commit -m "Leader Pharma Web FIX59 hors ligne V6"
            git push origin HEAD:main
          fi

          echo "WEB FIX59 HORS LIGNE V6 = PRET"
          echo "ANDROID / WEB = MEME SYSTEME VALIDE"
          echo "PHOTOS DEPART / MINUIT / ACTUALISER = CONSERVES"
